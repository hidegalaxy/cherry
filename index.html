    { id: 'bocataPavo', c: 'mer', obj: 'ganar mantener', n: 'Bocadillo de pavo y tomate', items: [['panBarra', 80], ['pavoLonchas', 60], ['tomate', 60], ['aceite', 5]], nota: 'Pan con tomate restregado, un hilo de aceite y el pavo.' },
    { id: 'tortitasCac', c: 'mer', obj: 'ganar', n: 'Tortitas de arroz con crema de cacahuete y plátano', items: [['tortitas', 24], ['cacahuete', 32], ['platano', 120]], nota: 'Unta las tortitas y pon el plátano en rodajas encima. Buena antes de entrenar.' },
    { id: 'requesonKiwi', c: 'mer', obj: 'mantener perder', n: 'Requesón con kiwi y nueces', items: [['requeson', 150], ['kiwi', 150], ['nueces', 10]], nota: 'Requesón con el kiwi troceado y las nueces partidas.' },

    { id: 'tortillaEsp', c: 'cen', obj: 'ganar mantener perder', n: 'Tortilla de espinacas con pan', items: [['huevo', 165], ['espinacas', 100], ['panInt', 60], ['aceite', 5]], nota: 'Saltea las espinacas 2 minutos, añade los huevos batidos y cuaja a fuego medio.' },
    { id: 'merluzaBoniato', c: 'cen', obj: 'ganar mantener perder', n: 'Merluza con boniato y judías verdes', items: [['merluza', 200], ['boniato', 200], ['judias', 150], ['aceite', 10]], nota: 'Boniato al horno o al microondas, judías al vapor y la merluza a la plancha.' },
    { id: 'wrapPollo', c: 'cen', obj: 'ganar mantener', n: 'Wraps de pollo con aguacate', items: [['wrap', 120], ['pollo', 150], ['lechuga', 50], ['tomate', 120], ['aguacate', 50]], nota: 'Pollo a la plancha en tiras con lechuga, tomate y aguacate. Enrolla y a la sartén 1 minuto.' },
    { id: 'tofuArroz', c: 'cen', obj: 'ganar mantener perder', n: 'Salteado de tofu, champiñones y arroz', items: [['tofu', 200], ['champis', 150], ['cebolla', 60], ['arroz', 60], ['aceite', 10]], nota: 'Tofu en dados bien dorado con los champiñones y la cebolla. Sirve con el arroz.' },
    { id: 'pavoEnsalada', c: 'cen', obj: 'mantener perder', n: 'Pavo a la plancha con patata y ensalada', items: [['pavo', 180], ['patata', 200], ['lechuga', 80], ['tomate', 120], ['aceite', 10]], nota: 'Patata cocida o al microondas, ensalada y el pavo a la plancha.' },
  ];
  // Parte de las kcal del día que va a cada comida.
  const PARTE = { des: 0.25, com: 0.35, mer: 0.15, cen: 0.25 };
  const objetivo = () => (OBJETIVO[D.perfil.objetivo] ? D.perfil.objetivo : 'ganar');

  // Recetas de esa comida que encajan con tu objetivo. Para perder grasa, primero las de más proteína por kcal.
  function recetasPara(m) {
    const o = objetivo();
    const lista = RECETAS.filter(r => r.c === m && r.obj.split(' ').includes(o));
    if (o !== 'perder') return lista;
    const dens = r => { const s = suma(r.items.map(([k, g]) => macros(alimento('b:' + k), g))); return s.prot / s.kcal; };
    return lista.sort((a, b) => dens(b) - dens(a));
  }
  // Las kcal que te tocan en esa comida: hoy, si aún no la has hecho, se reparte lo que te queda entre las comidas que faltan.
  function kcalComida(m) {
    const base = D.meta.kcal * PARTE[m];
    if (D.dia !== D.hoy || D.registro.some(x => x.comida === m)) return base;
    const libres = COMIDAS.map(c => c[0]).filter(id => !D.registro.some(x => x.comida === id));
    const queda = D.meta.kcal - suma(D.registro).kcal;
    return Math.max(base * 0.6, queda * PARTE[m] / libres.reduce((s, id) => s + PARTE[id], 0));
  }
  // La receta con las cantidades escaladas a esas kcal (entre ×0,6 y ×1,8), en unidades enteras o de 5 en 5 g.
  function escalar(r, kcal) {
    const base = r.items.map(([k, g]) => [alimento('b:' + k), g]);
    const f = Math.min(1.8, Math.max(0.6, kcal / suma(base.map(([a, g]) => macros(a, g))).kcal));
    return base.map(([a, g]) => [a, a.gUnidad ? Math.max(1, Math.round(g * f / a.gUnidad)) * a.gUnidad : Math.max(5, Math.round(g * f / 5) * 5)]);
  }
  const totalItems = items => suma(items.map(([a, g]) => macros(a, g)));

  // ---------- Estado ----------

  let D = null;           // datos del servidor (más lo apuntado que aún no ha llegado)
  let vista = 'today';
  let hoja = null;        // lo que enseña la hoja de abajo
  let cola = [];          // escrituras pendientes, en orden
  let ocupado = false;
  let deshacer = null;    // lo que hace el botón «Deshacer» del aviso
  try { vista = localStorage.getItem('cherry.vista') || 'today'; } catch (e) {}
  if (!TABS.some(t => t[0] === vista)) vista = 'today';
  try { cola = JSON.parse(localStorage.getItem('cherry.cola') || '[]'); } catch (e) {}

  function leerGuardado(nombre, valido) {
    const q = new URLSearchParams(location.search).get(nombre) || '';
    if (q && valido(q)) {
      try { localStorage.setItem('cherry.' + nombre, q); } catch (e) {}
      return q;
    }
    try { return localStorage.getItem('cherry.' + nombre) || ''; } catch (e) { return ''; }
  }

  // ---------- Servidor ----------

  // text/plain evita la comprobación previa del navegador, que el servidor de Google no contesta.
  async function llamar(que, d) {
    let r;
    try {
      r = que === 'datos'
        ? await fetch(URL_API + '?accion=datos&k=' + encodeURIComponent(K) + '&dia=' + encodeURIComponent(d || ''))
        : await fetch(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'accion', k: K, que, d, dia: D && D.dia }) });
    } catch (e) {
      const err = new Error('Sin conexión');
      err.red = true;
      throw err;
    }
    let j;
    try { j = await r.json(); } catch (e) { const err = new Error('El servidor no ha contestado bien'); err.red = true; throw err; }
    if (j && j.error) throw new Error(j.error);
    return j;
  }

  async function cargar(dia) {
    cargando(true);
    try {
      const r = await llamar('datos', dia || '');
      // Si aún hay cosas por subir, mandan ellas: al terminar la cola llegan los datos buenos.
      if (!cola.length || !D || r.dia !== D.dia) { D = r; guardarCache(); pintar(); }
    } catch (e) {
      if (/clave/i.test(e.message)) pantallaClave(e.message);
      else if (!D) $('vista').innerHTML = `<div class="tarjeta"><p><b>No se han podido cargar tus datos.</b> ${esc(e.message)}.</p><button class="btn sec" data-act="recargar">Probar otra vez</button></div>`;
      else avisar(e.red ? 'Sin conexión: enseño lo último que tenía' : 'Error: ' + e.message);
      quitarSplash();
    }
    cargando(false);
  }

  // Escribe: primero en pantalla (al instante) y luego en la hoja, de una en una y en orden.
  function enviar(que, d) {
    local(que, d);
    cola.push({ que, d });
    guardarCola();
    guardarCache();
    pintar();
    vaciar();
  }
  async function vaciar() {
    if (ocupado || !cola.length) return;
    ocupado = true;
    cargando(true);
    while (cola.length) {
      try {
        const r = await llamar(cola[0].que, cola[0].d);
        cola.shift();
        guardarCola();
        if (!cola.length && r.datos && (!D || r.datos.dia === D.dia)) { D = r.datos; guardarCache(); repintar(); }
      } catch (e) {
        if (e.red) { avisar('Sin conexión: se guardará al volver la red'); break; }
        cola.shift();
        guardarCola();
        avisar('No se ha guardado: ' + e.message);
        if (!cola.length) { ocupado = false; cargando(false); return cargar(D && D.dia); }
      }
    }
    ocupado = false;
    cargando(false);
  }
  addEventListener('online', vaciar);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !D) return;
    if (cola.length) return vaciar();
    // Al volver otro día, Today pasa al día nuevo.
    if (D.hoy !== hoyLocal() && D.dia === D.hoy) cargar(hoyLocal());
  });

  // Lo mismo que hará el servidor, aplicado ya en pantalla.
  function local(que, d) {
    if (!D) return;
    const upsert = (lista, obj) => { const i = lista.findIndex(x => x.id === obj.id); if (i >= 0) lista[i] = { ...lista[i], ...obj }; else lista.push(obj); };
    if (que === 'apuntar' && d.dia === D.dia) d.items.forEach(x => D.registro.push({ ...x, dia: d.dia, comida: d.comida, nuevo: true }));
    if (que === 'editarEntrada') {
      const e = D.registro.find(x => x.id === d.id);
      if (e && d.gramos) { const f = d.gramos / e.gramos; ['kcal', 'prot', 'carb', 'grasa'].forEach(c => { e[c] *= f; }); e.gramos = d.gramos; }
      if (e && d.comida) e.comida = d.comida;
    }
    if (que === 'borrarEntrada') D.registro = D.registro.filter(x => x.id !== d.id);
    if (que === 'alimento') upsert(D.alimentos, d);
    if (que === 'borrarAlimento') D.alimentos = D.alimentos.filter(x => x.id !== d.id);
    if (que === 'plato') upsert(D.platos, d);
    if (que === 'borrarPlato') D.platos = D.platos.filter(x => x.id !== d.id);
    if (que === 'peso' || (que === 'perfil' && d.peso)) {
      const dia = d.dia || D.hoy;
      D.pesos = D.pesos.filter(p => p.dia !== dia).concat({ dia, kg: +d.kg || +d.peso }).sort((a, b) => (a.dia < b.dia ? -1 : 1));
    }
    if (que === 'perfil') {
      ['sexo', 'edad', 'altura', 'actividad', 'objetivo'].forEach(c => { if (d[c] != null) D.perfil[c] = d[c]; });
      if (d.meta) D.meta = { ...d.meta, dia: D.hoy, motivo: 'tus datos' };
    }
    if (que === 'meta') D.meta = { ...d, dia: D.hoy };
    if (que === 'diario') {
      const x = { ...(D.diarios.find(y => y.dia === d.dia) || { dia: d.dia, agua: 0, creatina: false }) };
      if (d.agua != null) x.agua = d.agua;
      if (d.creatina != null) x.creatina = !!d.creatina;
      D.diarios = D.diarios.filter(y => y.dia !== d.dia).concat(x).sort((a, b) => (a.dia < b.dia ? -1 : 1));
      if (d.dia === D.dia) D.diario = x;
      D.semana = D.semana.map(s => s.dia === d.dia ? { ...s, agua: x.agua, creatina: x.creatina } : s);
    }
  }

  function guardarCache() {
    if (!D || D.dia !== D.hoy) return;
    try { localStorage.setItem('cherry.cache', JSON.stringify(D)); } catch (e) {}
  }
  function leerCache() {
    try { return JSON.parse(localStorage.getItem('cherry.cache') || 'null'); } catch (e) { return null; }
  }
  function guardarCola() {
    try { localStorage.setItem('cherry.cola', JSON.stringify(cola)); } catch (e) {}
  }
  function cargando(si) { $('carga').classList.toggle('ver', si); }

  // ---------- Pantalla de carga ----------

  const SPLASH_DESDE = Date.now();
  const FRASES = ['Abriendo tu despensa…', 'Pesando la avena…', 'Contando la proteína…', 'Pelando el plátano…', 'Calentando la sartén…', 'Casi está…'];
  let nFrase = 0;
  const cambiarFrase = setInterval(() => {
    const f = $('frase');
    if (!f) return clearInterval(cambiarFrase);
    f.style.opacity = 0;
    setTimeout(() => { nFrase = (nFrase + 1) % FRASES.length; f.textContent = FRASES[nFrase]; f.style.opacity = 1; }, 250);
  }, 1300);
  // Se ve al menos un momento, aunque los datos lleguen enseguida (o salgan de la memoria del móvil).
  function quitarSplash() {
    const s = $('splash');
    if (!s || s.classList.contains('fuera')) return;
    setTimeout(() => {
      s.classList.add('fuera');
      clearInterval(cambiarFrase);
      setTimeout(() => s.remove(), 500);
    }, Math.max(0, 1100 - (Date.now() - SPLASH_DESDE)));
  }

  // ---------- Alimentos ----------

  // Un alimento de la tabla (id «b:…») o de los tuyos, siempre con la misma forma.
  function alimento(id) {
    if (!id) return null;
    if (id.startsWith('b:')) {
      const b = BASE[id.slice(2)];
      return b ? { id, nombre: b[0], kcal: b[1], prot: b[2], carb: b[3], grasa: b[4], unidad: b[5] || '', gUnidad: b[6] || 0, ml: !!b[7], fuente: 'base' } : null;
    }
    return D.alimentos.find(a => a.id === id) || null;
  }
  const macros = (a, g) => ({ kcal: a.kcal * g / 100, prot: a.prot * g / 100, carb: a.carb * g / 100, grasa: a.grasa * g / 100 });
  const suma = lista => lista.reduce((t, x) => ({ kcal: t.kcal + x.kcal, prot: t.prot + x.prot, carb: t.carb + x.carb, grasa: t.grasa + x.grasa }), { kcal: 0, prot: 0, carb: 0, grasa: 0 });
  const plural = (u, n) => n === 1 ? u : /ón$/.test(u) ? u.replace(/ón$/, 'ones') : u + (/[aeiouáéíóú]$/.test(u) ? 's' : 'es');
  // «2 huevos», «1 vaso» o «150 g».
  function cant(a, g) {
    const u = a && a.gUnidad;
    if (u) {
      const n = g / u;
      if (n >= 0.5 && Math.abs(n * 2 - Math.round(n * 2)) < 0.02) {
        const r = Math.round(n * 2) / 2;
        return (r === 0.5 ? 'media' : n1(r)) + ' ' + (r === 0.5 ? a.unidad : plural(a.unidad, r));
      }
    }
    return n0(g) + (a && a.ml ? ' ml' : ' g');
  }
  // Entrada del registro con sus macros ya calculados (se guardan así en la hoja).
  function entrada(a, g) {
    const m = macros(a, g);
    return { id: nid('r'), alimento: a.id, nombre: a.nombre, gramos: Math.round(g), kcal: Math.round(m.kcal), prot: +m.prot.toFixed(1), carb: +m.carb.toFixed(1), grasa: +m.grasa.toFixed(1) };
  }
  const resumenMacros = m => `<span class="p">P ${n1(m.prot)}</span> · <span class="c">C ${n1(m.carb)}</span> · <span class="g">G ${n1(m.grasa)}</span>`;

  function buscarLocal(q) {
    q = sinAcentos(q.trim());
    if (!q) return [];
    const palabras = q.split(/\s+/);
    const vale = n => { const s = sinAcentos(n); return palabras.every(p => s.includes(p)); };
    const mios = D.alimentos.filter(a => vale(a.nombre));
    const tabla = Object.keys(BASE).map(k => alimento('b:' + k)).filter(a => vale(a.nombre));
    return [...mios, ...tabla].slice(0, 30);
  }

  // Open Food Facts: base libre de productos envasados, con sus valores por 100 g.
  function deOFF(p, codigo) {
    const n = p.nutriments || {};
    let kcal = n['energy-kcal_100g'];
    if (kcal == null && n.energy_100g != null) kcal = n.energy_100g / 4.184;
    if (kcal == null || isNaN(kcal)) return null;
    const marca = String(p.brands || '').split(',')[0].trim();
    const nombre = String(p.product_name_es || p.product_name || 'Producto sin nombre').trim();
    const racion = Number(p.serving_quantity);
    const r1 = x => Math.round((Number(x) || 0) * 10) / 10;
    return {
      nombre: (nombre + (marca && !sinAcentos(nombre).includes(sinAcentos(marca)) ? ' · ' + marca : '')).slice(0, 80),
      kcal: Math.round(kcal), prot: r1(n.proteins_100g), carb: r1(n.carbohydrates_100g), grasa: r1(n.fat_100g),
      unidad: racion > 0 && racion < 1000 ? 'ración' : '', gUnidad: racion > 0 && racion < 1000 ? Math.round(racion) : 0,
      ml: false, codigo: String(codigo || p.code || '').replace(/\D/g, ''), fuente: 'off',
    };
  }
  const CAMPOS_OFF = 'code,product_name,product_name_es,brands,nutriments,serving_quantity';
  async function offCodigo(codigo) {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + codigo + '.json?fields=' + CAMPOS_OFF);
    if (r.status === 404) return null;
    const j = await r.json();
    return j.status === 1 && j.product ? deOFF(j.product, codigo) : null;
  }
  async function offBuscar(q) {
    const r = await fetch('https://es.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=25&fields=' + CAMPOS_OFF + '&search_terms=' + encodeURIComponent(q));
    const j = await r.json();
    return (j.products || []).map(p => deOFF(p)).filter(Boolean);
  }
  // Guarda un producto de Open Food Facts en tus alimentos (o reutiliza el que ya tenías con ese código).
  function guardarDeOFF(p) {
    const ya = p.codigo && D.alimentos.find(a => a.codigo === p.codigo);
    if (ya) return ya;
    const a = { ...p, id: nid('a') };
    enviar('alimento', a);
    return a;
  }

  // ---------- Pintar ----------

  function pintar() {
    if (!D) return;
    // Datos guardados en el móvil por una versión anterior, sin agua ni creatina.
    D.diarios = D.diarios || [];
    D.diario = D.diario || D.diarios.find(x => x.dia === D.dia) || { dia: D.dia, agua: 0, creatina: false };
    const sinMeta = !D.meta;
    $('nav').hidden = sinMeta;
    $('mas').hidden = sinMeta;
    if (sinMeta) {
      $('titulo').textContent = 'Cherry';
      $('sub').innerHTML = '';
      $('vista').innerHTML = bienvenida();
      prepararPerfil();
      quitarSplash();
      return;
    }
    $('titulo').textContent = TABS.find(t => t[0] === vista)[1];
    $('sub').innerHTML = subtitulo();
    $('vista').innerHTML = VISTAS[vista]();
    $('nav').innerHTML = TABS.map(([id, t]) => `<button data-tab="${id}" ${id === vista ? 'aria-current="page"' : ''}>${ico(id, 22)}${t}</button>`).join('');
    D.registro.forEach(x => delete x.nuevo);
    quitarSplash();
  }
  // Tras una respuesta del servidor: repinta sin perder el scroll ni lo que se está escribiendo en una hoja.
  function repintar() {
    const top = $('vista').scrollTop;
    const enFoco = document.activeElement && $('vista').contains(document.activeElement) ? document.activeElement.id : '';
    if (enFoco) return;
    pintar();
    $('vista').scrollTop = top;
  }

  function subtitulo() {
    if (vista === 'today') {
      const esHoy = D.dia === D.hoy;
      return `<button data-act="dia" data-n="-1" aria-label="Día anterior">${ico('izq', 18)}</button><span class="num">${esHoy ? 'hoy, ' : ''}${fecha(D.dia)}</span>
        <button data-act="dia" data-n="1" aria-label="Día siguiente" ${esHoy ? 'disabled' : ''}>${ico('der', 18)}</button>${esHoy ? '' : '<button class="volver" data-act="dia" data-n="0">Volver a hoy</button>'}`;
    }
    if (vista === 'foods') return `<span>${D.alimentos.length} tuyos · ${D.platos.length} ${D.platos.length === 1 ? 'plato' : 'platos'}</span>`;
    return `<span>${esc((OBJETIVO[D.perfil.objetivo] || OBJETIVO.ganar).nombre.toLowerCase())}</span>`;
  }

  const VISTAS = {
    today() {
      const t = suma(D.registro);
      const M = D.meta;
      const queda = M.kcal - t.kcal;
      const esHoy = D.dia === D.hoy;
      const sig = COMIDAS.find(([id]) => !D.registro.some(x => x.comida === id));
      const barras = [['Proteína', t.prot, M.prot, 'var(--pro)'], ['Carbos', t.carb, M.carb, 'var(--car)'], ['Grasa', t.grasa, M.grasa, 'var(--fat)']];
      return `<section class="hero ${esHoy ? '' : 'pasado'}"><span class="eti">${queda >= 0 ? (esHoy ? 'Te quedan' : 'Quedaron') : (esHoy ? 'Te has pasado' : 'Te pasaste')}</span>
          <h2>${n0(Math.abs(queda))} <small>kcal</small></h2>
          <div class="pista"><em style="width:${Math.min(100, t.kcal / M.kcal * 100)}%"></em></div>
          <p>${n0(t.kcal)} de ${n0(M.kcal)}${esHoy && sig && D.registro.length ? ' · falta la ' + sig[1].toLowerCase() : ''}</p></section>
        <div class="macros">${barras.map(([n, v, m, c]) => `<div class="macro"><b>${n}</b><span>${n0(v)} <small>/ ${n0(m)} g</small></span><i><em style="width:${Math.min(100, v / m * 100)}%;background:${c}"></em></i></div>`).join('')}</div>
        ${habitosHtml()}
        ${tipHtml(t)}
        <div class="comidas">${COMIDAS.map(([id, nombre]) => {
          const it = D.registro.filter(x => x.comida === id);
          const s = suma(it);
          return `<section class="comida"><div class="fila1"><b>${nombre}</b><span>${it.length ? n0(s.kcal) + ' kcal' : ''}</span>
              <button class="mini" data-act="abrir" data-m="${id}" aria-label="Añadir a ${nombre.toLowerCase()}">${ico('mas', 16, 2.6)}</button></div>
            ${it.length ? it.map(x => `<button class="item ${x.nuevo ? 'nuevo' : ''}" data-act="entrada" data-id="${esc(x.id)}"><span>${esc(x.nombre)} · ${cant(alimento(x.alimento), x.gramos)}</span><span>${n0(x.kcal)}</span></button>`).join('')
              : `<span class="vacio">${esHoy ? 'Nada todavía' : 'Nada apuntado'}</span>`}
            ${it.length >= 2 ? `<button class="enlace" data-act="guardarPlato" data-m="${id}">Guardar como plato</button>` : ''}
          </section>`;
        }).join('')}</div>`;
    },
    foods() {
      const platos = D.platos.map(p => {
        const s = suma(p.items.map(([id, g]) => { const a = alimento(id); return a ? macros(a, g) : { kcal: 0, prot: 0, carb: 0, grasa: 0 }; }));
        return `<div class="ali"><button class="txt" data-act="verPlato" data-id="${esc(p.id)}"><b>${esc(p.nombre)}</b><small>${p.items.map(([id, g]) => { const a = alimento(id); return a ? esc(a.nombre.replace(/ \(.*\)$/, '').toLowerCase()) + ' ' + cant(a, g) : ''; }).filter(Boolean).join(' · ')}</small></button><span class="num">${n0(s.kcal)}</span></div>`;
      }).join('');
      const mios = D.alimentos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
      return `${menusHtml()}
        <div class="rapido"><input id="filtro" placeholder="Buscar en tus alimentos" aria-label="Buscar en tus alimentos" autocomplete="off"><button data-act="escanear" aria-label="Escanear código de barras">${ico('codigo', 18)}</button></div>
        <div class="grupo"><span class="eti">Mis platos</span>
          ${platos ? `<div class="lista">${platos}</div>` : '<p class="nota">Cuando una comida tenga dos o más cosas, pulsa «Guardar como plato» en Today y aquí podrás apuntarla entera con un toque.</p>'}</div>
        <div class="grupo"><span class="eti">Mis alimentos · por 100 g</span>
          ${mios.length ? `<div class="lista" id="listaFoods">${mios.map(a => `<div class="ali" data-nombre="${esc(sinAcentos(a.nombre))}"><button class="txt" data-act="editarAlimento" data-id="${esc(a.id)}"><b>${esc(a.nombre)}</b><small>${n0(a.kcal)} kcal · P ${n1(a.prot)} · C ${n1(a.carb)} · G ${n1(a.grasa)}</small></button><span class="fuente ${a.fuente}">${a.fuente === 'off' ? 'Código' : 'Tuyo'}</span></div>`).join('')}</div>`
            : '<p class="nota">Aquí se guardan los productos que escanees y los que crees a mano.</p>'}</div>
        <button class="btn ancho sec" data-act="nuevoAlimento">+ Alimento a mano</button>
        <p class="nota">Además, al buscar salen ${Object.keys(BASE).length} alimentos frescos y básicos de la tabla incluida (valores medios). Para lo envasado, mejor el código de barras: trae los valores de la etiqueta desde Open Food Facts.</p>`;
    },
    progress() {
      const conMedia = mediaMovil(D.pesos);
      const ultima = conMedia[conMedia.length - 1];
      const ritmo = ritmoSemanal(D.pesos, D.hoy);
      const obj = OBJETIVO[D.perfil.objetivo] || OBJETIVO.ganar;
      const enRitmo = ritmo != null && ritmo >= obj.ritmo[0] && ritmo <= obj.ritmo[1];
      const pesoHoy = D.pesos.find(p => p.dia === D.hoy);
      const aj = revisarAjuste(D.pesos, D.meta, D.perfil.objetivo, D.hoy);
      const semana = D.semana.map(s => s.dia === D.dia ? { ...s, kcal: suma(D.registro).kcal, prot: suma(D.registro).prot, n: D.registro.length } : s);
      const pasados = semana.filter(s => s.dia !== D.hoy && s.n);
      const mediaK = pasados.length ? promedio(pasados.map(s => s.kcal)) : 0;
      const cumplidos = pasados.filter(s => s.prot >= D.meta.prot).length;
    const conAgua = semana.filter(s => s.agua > 0);
    const diasCreatina = semana.filter(s => s.creatina).length;
      let ajuste;
      if (aj.estado === 'pronto') ajuste = `<p>Tu meta es del ${fecha(D.meta.dia)}. La reviso el <b>${fecha(aj.proxima)}</b> con la media de tu peso. Buscamos ${n1(obj.ritmo[0])} a ${n1(obj.ritmo[1])} kg por semana; si te sales, te propongo subir o bajar ${PASO_AJUSTE} kcal.</p>`;
      else if (aj.estado === 'faltan') ajuste = `<p>Ya toca revisar la meta, pero me faltan pesadas: necesito 3 de esta semana (llevas ${aj.ahora}) y 3 de hace dos semanas (hay ${aj.antes}). Pésate en ayunas unas mañanas.</p>`;
      else if (aj.estado === 'ok') ajuste = `<p>Vas a <b>${n1(aj.ritmo)} kg por semana</b>, dentro de lo que buscamos (${n1(aj.min)} a ${n1(aj.max)}). Mantengo ${n0(D.meta.kcal)} kcal.</p><div class="fila"><button class="btn sec" data-act="mantenerMeta">Vale, revisar en 2 semanas</button></div>`;
      else ajuste = `<p>Vas a <b>${n1(aj.ritmo)} kg por semana</b> y buscamos de ${n1(aj.min)} a ${n1(aj.max)}. Te propongo <b>${aj.cambio > 0 ? '+' : '−'}${Math.abs(aj.cambio)} kcal</b>: ${n0(aj.nueva.kcal)} al día, todo en carbohidratos.</p>
          <div class="fila"><button class="btn" data-act="aplicarAjuste">Pasar a ${n0(aj.nueva.kcal)} kcal</button><button class="btn sec" data-act="mantenerMeta">Dejarlo igual</button></div>`;
      return `<section class="tarjeta"><span class="eti">Peso · media de 7 días</span>
          ${ultima ? `<div class="grande"><b>${n1(ultima.media)} kg</b>${ritmo != null ? `<span class="chip ${enRitmo ? '' : 'aviso'}">${ritmo >= 0 ? '+' : '−'}${n1(Math.abs(ritmo))} kg/sem${enRitmo ? ' · en ritmo' : ''}</span>` : '<span class="chip gris">ritmo: faltan pesadas</span>'}</div>` : ''}
          ${graficaPeso(conMedia)}
          <form class="linea2" data-form="peso"><input class="campo" id="peso" inputmode="decimal" autocomplete="off" placeholder="${pesoHoy ? 'Hoy: ' + n1(pesoHoy.kg) + ' kg' : 'Peso de hoy (kg)'}" aria-label="Peso de hoy en kg"><button class="btn">Guardar</button></form>
          <p>Pésate por la mañana, en ayunas. Mira la media, no el día: el peso diario baila hasta 1 kg por agua y sal.</p></section>
        <section class="tarjeta"><span class="eti">Últimos 7 días</span>
          ${barrasSemana(semana)}
          <p>${pasados.length ? `Media <b>${n0(mediaK)} kcal</b>${D.dia === D.hoy ? ' sin contar hoy' : ''} · proteína cumplida <b>${cumplidos} de ${pasados.length} días</b>. ` : ''}La línea es tu meta de ${n0(D.meta.kcal)} y el punto azul, la proteína cumplida.</p>
          <p>Agua: ${conAgua.length ? `media <b>${litros(promedio(conAgua.map(s => s.agua)))}</b> de ${litros(metaAgua(pesoActual()))} los días que la apuntaste` : 'aún sin apuntar'} · creatina <b>${diasCreatina} de 7 días</b>${racha(D.diarios, D.hoy) > 1 ? `, racha de ${racha(D.diarios, D.hoy)}` : ''}.</p></section>
        <section class="tarjeta"><span class="eti">Ajuste cada 2 semanas</span>${ajuste}</section>
        <section class="tarjeta"><span class="eti">Tu meta diaria</span>
          <div class="objetivos">${[[n0(D.meta.kcal), 'kcal'], [n0(D.meta.prot) + ' g', 'proteína'], [n0(D.meta.carb) + ' g', 'carbos'], [n0(D.meta.grasa) + ' g', 'grasa']].map(([v, t]) => `<div><b>${v}</b><span>${t}</span></div>`).join('')}</div>
          <div class="fila"><button class="btn sec" data-act="perfil">Cambiar mis datos</button><button class="btn sec" data-act="metaMano">Meta a mano</button></div></section>
        <section class="tarjeta"><span class="eti">Widget del iPhone</span>
          <p>Lo que te queda hoy y tus macros, en la pantalla de inicio. Se actualiza solo cada 15 minutos y al tocarlo abre Cherry.</p>
          <p>1. Instala <b>Scriptable</b> (gratis, App Store).<br>2. Pulsa el botón de abajo, abre Scriptable, crea un script nuevo con <b>+</b>, pega el código y llámalo <b>Cherry</b>.<br>3. Mantén pulsada la pantalla de inicio → <b>+</b> → Scriptable → tamaño pequeño o mediano. Toca el widget y en <b>Script</b> elige Cherry.</p>
          <button class="btn sec" data-act="copiarWidget">Copiar código del widget</button></section>`;
    },
  };

  // Menús saludables de Foods: un día completo (una receta por comida, cambia cada día) o las recetas de una comida.
  let menuSel = 'dia';
  let menuOtro = 0;
  function menusHtml() {
    const fila = (r, items, etiq) => {
      const s = totalItems(items);
      return `<div class="ali"><button class="txt" data-act="verReceta" data-id="${r.id}" data-m="${r.c}">${etiq ? `<span class="etiq">${etiq}</span>` : ''}<b>${esc(r.n)}</b><small>${n0(s.kcal)} kcal · P ${n0(s.prot)} · C ${n0(s.carb)} · G ${n0(s.grasa)}</small></button></div>`;
    };
    let cuerpo;
    if (menuSel === 'dia') {
      const n = diasEntre('2026-01-01', D.hoy) + menuOtro;
      const dia = COMIDAS.map(([m, nombre]) => {
        const l = recetasPara(m);
        const r = l[n % l.length];
        return { r, items: escalar(r, D.meta.kcal * PARTE[m]), nombre };
      });
      const t = totalItems(dia.flatMap(x => x.items));
      cuerpo = `<div class="lista">${dia.map(x => fila(x.r, x.items, x.nombre)).join('')}</div>
        <p class="nota">Total <b style="color:var(--text)">${n0(t.kcal)} kcal</b> · P ${n0(t.prot)} · C ${n0(t.carb)} · G ${n0(t.grasa)}. Tu meta: ${n0(D.meta.kcal)} kcal y ${n0(D.meta.prot)} g de proteína.</p>
        <button class="btn sec" data-act="otroMenu">Otro menú</button>`;
    } else {
      cuerpo = `<div class="lista">${recetasPara(menuSel).map(r => fila(r, escalar(r, D.meta.kcal * PARTE[menuSel]))).join('')}</div>`;
    }
    return `<div class="grupo"><span class="eti">Menús para ${OBJETIVO[objetivo()].nombre.toLowerCase()}</span>
      <div class="chips">${[['dia', 'Día completo'], ...COMIDAS].map(([v, t]) => `<button type="button" data-act="menu" data-v="${v}" aria-pressed="${v === menuSel}">${t}</button>`).join('')}</div>
      ${cuerpo}<p class="nota">Las cantidades ya están ajustadas a tu meta. Toca una receta para ver cómo se hace y apuntarla.</p></div>`;
  }

  // Agua (vasos de 250 ml hasta tu meta) y creatina (un toque al día, con racha).
  const litros = ml => (Math.round(ml / 10) / 100).toLocaleString('es-ES', { maximumFractionDigits: 2 }) + ' L';
  const pesoActual = () => (D.pesos[D.pesos.length - 1] || {}).kg || 70;
  function habitosHtml() {
    const x = D.diario;
    const meta = metaAgua(pesoActual());
    const vasos = Math.round(meta / 250);
    const llenos = Math.min(vasos, Math.floor(x.agua / 250));
    const r = racha(D.diarios, D.hoy);
    return `<div class="habitos">
      <section class="hab"><span class="eti">Agua</span>
        <span class="val">${litros(x.agua)} <small>de ${litros(meta)}</small></span>
        <div class="vasos" aria-hidden="true">${Array.from({ length: vasos }, (_, i) => `<i class="${i < llenos ? 'lleno' : ''}"></i>`).join('')}</div>
        <div class="botones"><button data-act="agua" data-ml="250">+ vaso</button><button data-act="agua" data-ml="500">+ botella</button><button class="menos" data-act="agua" data-ml="-250" aria-label="Quitar un vaso" ${x.agua ? '' : 'disabled'}>−</button></div></section>
      <section class="hab crea"><span class="eti">Creatina</span>
        <button class="marca" data-act="creatina" aria-pressed="${x.creatina}">${x.creatina ? ico('ok', 16, 2.6) + ' 5 g' : 'Marcar 5 g'}</button>
        <small>${r ? `Racha: ${r} ${r === 1 ? 'día' : 'días'}` : 'Cada día, a la hora que quieras'}</small></section></div>`;
  }

  // Sugerencia de proteína con tus habituales (solo hoy y si falta bastante).
  function sugerencia(t) {
    if (D.dia !== D.hoy) return null;
    const falta = D.meta.prot - t.prot;
    if (falta < 20) return null;
    const cand = D.habituales.map(h => ({ a: alimento(h.alimento), g: h.gramos })).filter(x => x.a)
      .map(x => ({ ...x, m: macros(x.a, x.g) })).filter(x => x.m.prot >= 8 && x.m.prot * 4 / Math.max(1, x.m.kcal) >= 0.3)
      .sort((a, b) => b.m.prot - a.m.prot);
    const elegidos = [];
    let p = 0;
    for (const c of cand) {
      if (elegidos.length === 2 || p >= falta * 0.8) break;
      if (p + c.m.prot <= falta + 10) { elegidos.push(c); p += c.m.prot; }
    }
    if (!elegidos.length) return null;
    const sig = COMIDAS.find(([id]) => !D.registro.some(x => x.comida === id)) || COMIDAS[3];
    return { falta, items: elegidos, m: suma(elegidos.map(x => x.m)), comida: sig[0] };
  }
  function tipHtml(t) {
    const s = sugerencia(t);
    if (!s) return '';
    return `<section class="tip"><span class="eti">Para la ${nombreComida(s.comida).toLowerCase()}</span>
      <p>Te faltan <b>${n0(s.falta)} g de proteína</b>. Con tus habituales: ${esc(s.items.map(x => describir(x.a, x.g)).join(' y '))} suman ${n0(s.m.prot)} g y ${n0(s.m.kcal)} kcal.</p>
      <div class="fila"><button class="btn" data-act="tip">Añadir a la ${nombreComida(s.comida).toLowerCase()}</button><button class="btn sec" data-act="abrir" data-m="${s.comida}">Elegir otra cosa</button></div></section>`;
  }

  function graficaPeso(pesos) {
    const W = 340, H = 150, L = 32, B = 20;
    const d0 = diaMas(D.hoy, -27);
    const ps = pesos.filter(p => p.dia >= d0);
    if (ps.length < 2) return `<p>${ps.length ? 'Ya tienes la primera pesada. ' : ''}Apunta tu peso unas cuantas mañanas y aquí verás la tendencia de las últimas 4 semanas.</p>`;
    const vals = ps.flatMap(p => [p.kg, p.media]);
    let lo = Math.floor((Math.min(...vals) - 0.2) * 2) / 2, hi = Math.ceil((Math.max(...vals) + 0.2) * 2) / 2;
    if (hi - lo < 1) hi = lo + 1;
    const paso = hi - lo > 3 ? 1 : 0.5;
    const x = dia => L + diasEntre(d0, dia) * (W - L - 8) / 27;
    const y = v => 8 + (hi - v) / (hi - lo) * (H - B - 8);
    const linea = ps.map((p, i) => `${i ? 'L' : 'M'}${x(p.dia).toFixed(1)},${y(p.media).toFixed(1)}`).join('');
    const marcas = [];
    for (let v = lo; v <= hi + 1e-9; v += paso) marcas.push(v);
    const ult = ps[ps.length - 1];
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de las últimas 4 semanas">
      ${marcas.map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v) + 3}">${n1(v)}</text>`).join('')}
      ${ps.map(p => `<circle cx="${x(p.dia)}" cy="${y(p.kg)}" r="2.6" fill="var(--dim)"/>`).join('')}
      <path d="${linea} L${x(ult.dia)},${H - B} L${x(ps[0].dia)},${H - B} Z" fill="var(--cherry)" opacity=".08"/>
      <path d="${linea}" fill="none" stroke="var(--cherry)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(ult.dia)}" cy="${y(ult.media)}" r="5" fill="var(--cherry)" stroke="var(--surface)" stroke-width="2"/>
      ${[[d0, 'start'], [diaMas(D.hoy, -14), 'middle'], [D.hoy, 'end']].map(([d, a]) => `<text x="${x(d)}" y="${H - 4}" text-anchor="${a}">${fecha(d).slice(4)}</text>`).join('')}
    </svg>`;
  }

  function barrasSemana(semana) {
    const W = 340, H = 130, B = 34, bw = 30, gap = (W - 7 * bw) / 6;
    const max = Math.max(D.meta.kcal * 1.15, ...semana.map(s => s.kcal));
    const y = k => 6 + (1 - k / max) * (H - B - 6);
    const letra = d => 'DLMXJVS'[new Date(d + 'T12:00:00').getDay()];
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías de los últimos 7 días">
      ${semana.map((s, i) => { const bx = i * (bw + gap); const hoy = s.dia === D.hoy; return `
        ${s.n ? `<rect x="${bx}" y="${y(s.kcal)}" width="${bw}" height="${Math.max(0, H - B - y(s.kcal))}" rx="7" fill="var(--cherry)" opacity="${hoy ? .4 : .85}"/>` : `<rect x="${bx}" y="${H - B - 3}" width="${bw}" height="3" rx="1.5" fill="var(--track)"/>`}
        <circle cx="${bx + bw / 2}" cy="${H - 24}" r="4" fill="${s.n && s.prot >= D.meta.prot ? 'var(--pro)' : 'none'}" stroke="${s.n ? 'var(--pro)' : 'var(--track)'}" stroke-width="1.5"/>
        <text x="${bx + bw / 2}" y="${H - 5}" text-anchor="middle" style="${hoy ? 'fill:var(--text)' : ''}">${letra(s.dia)}</text>`; }).join('')}
      <line x1="0" x2="${W}" y1="${y(D.meta.kcal)}" y2="${y(D.meta.kcal)}" stroke="var(--text)" stroke-dasharray="4 4" opacity=".5"/>
    </svg>`;
  }

  // ---------- Tus datos (primera vez y «Cambiar mis datos») ----------

  let perfilForm = {};
  function formPerfil(boton) {
    const p = perfilForm;
    const chips = (campo, ops) => `<div class="chips" role="group">${ops.map(([v, t, s]) => `<button type="button" data-act="perfilChip" data-campo="${campo}" data-v="${v}" aria-pressed="${p[campo] === v}">${t}${s ? `<small>${s}</small>` : ''}</button>`).join('')}</div>`;
    return `<form class="grupo" data-form="perfil" style="gap:14px">
      <span class="eti">Objetivo</span>${chips('objetivo', [['ganar', 'Ganar músculo'], ['mantener', 'Mantener'], ['perder', 'Perder grasa']])}
      <span class="eti">Sexo (para la fórmula)</span>${chips('sexo', [['h', 'Hombre'], ['m', 'Mujer']])}
      <div class="rejilla">
        <label class="camp"><span>Peso (kg)</span><input class="campo" id="pfPeso" inputmode="decimal" value="${esc(p.peso || '')}" autocomplete="off"></label>
        <label class="camp"><span>Altura (cm)</span><input class="campo" id="pfAltura" inputmode="numeric" value="${esc(p.altura || '')}" autocomplete="off"></label>
        <label class="camp"><span>Edad</span><input class="campo" id="pfEdad" inputmode="numeric" value="${esc(p.edad || '')}" autocomplete="off"></label>
      </div>
      <span class="eti">Actividad</span>${chips('actividad', [['poco', 'Poca', '0–2 entrenos'], ['medio', 'Media', '3–5 entrenos'], ['mucho', 'Mucha', '6–7 o trabajo físico']])}
      <div class="resumen" id="pfResumen"></div>
      <button class="btn ancho" id="pfGuardar">${boton}</button>
    </form>`;
  }
  function leerPerfil() {
    const num = id => parseFloat(String($(id).value).replace(',', '.'));
    Object.assign(perfilForm, { peso: num('pfPeso'), altura: num('pfAltura'), edad: num('pfEdad') });
    const p = perfilForm;
    const ok = p.peso > 30 && p.peso < 250 && p.altura > 120 && p.altura < 230 && p.edad >= 14 && p.edad < 100 && p.sexo;
    return ok ? calcularMeta(p) : null;
  }
  function pintarResumenPerfil() {
    const m = leerPerfil();
    $('pfGuardar').disabled = !m;
    $('pfResumen').innerHTML = m
      ? `<span class="eti">Tu meta diaria</span><b>${n0(m.kcal)} kcal</b><span class="num">${resumenMacros({ prot: m.prot, carb: m.carb, grasa: m.grasa })} (g)</span>
         <p class="nota">Gastas unas ${n0(m.mant)} kcal al día. ${perfilForm.objetivo === 'ganar' ? 'Comes 250 más para ganar músculo sin coger mucha grasa' : perfilForm.objetivo === 'perder' ? 'Comes 400 menos para perder grasa sin perder músculo' : 'Comes lo mismo que gastas'}, con ${(OBJETIVO[perfilForm.objetivo] || OBJETIVO.ganar).prot} g de proteína por kg. Cada 2 semanas lo ajusto con tu peso real.</p>`
      : '<p class="nota">Rellena tu peso, altura, edad y sexo para calcular tu meta.</p>';
  }
  function prepararPerfil() {
    if ($('pfResumen')) pintarResumenPerfil();
  }
  function bienvenida() {
    if (!perfilForm.objetivo) perfilForm = { objetivo: 'ganar', actividad: 'medio', ...D.perfil, peso: (D.pesos[D.pesos.length - 1] || {}).kg || '' };
    return `<section class="bienvenida grupo" style="gap:10px"><h2>Calculemos lo que necesitas comer</h2>
      <p>Con tu peso, altura, edad y actividad saco tu meta de calorías y macros. Luego la ajusto cada 2 semanas según cómo cambie tu peso.</p></section>
      ${formPerfil('Empezar')}`;
  }

  // ---------- Hojas ----------

  function abrirHoja(h) {
    hoja = h;
    pintarHoja();
  }
  function cerrarHoja() {
    pararLector();
    hoja = null;
    $('velo').hidden = true;
    $('velo').innerHTML = '';
  }
  const chipsComida = m => `<div class="chips">${COMIDAS.map(([id, n]) => `<button type="button" data-act="comida" data-m="${id}" aria-pressed="${id === m}">${n}</button>`).join('')}</div>`;

  function pintarHoja() {
    const H = hoja;
    let html = '';
    if (H.modo === 'lista') {
      html = `<div class="hoja alta">${cabH('Añadir a la ' + nombreComida(H.m).toLowerCase())}${chipsComida(H.m)}
        <form class="rapido" data-form="buscar"><input id="buscar" type="search" enterkeyhint="search" placeholder="Busca: «pollo», «skyr», «avena»…" aria-label="Buscar alimento" value="${esc(H.busca || '')}" autocomplete="off"><button type="button" data-act="escanear" aria-label="Escanear código de barras">${ico('codigo', 18)}</button></form>
        <div id="resultados" class="grupo" style="gap:16px">${resultados()}</div></div>`;
    } else if (H.modo === 'racion') {
      const a = H.a, m = macros(a, H.g || 0);
      const raciones = [...(a.gUnidad ? [[a.gUnidad, '1 ' + a.unidad], [a.gUnidad * 2, '2 ' + plural(a.unidad, 2)]] : []), [100, '100'], [150, '150'], [200, '200']]
        .filter((r, i, arr) => arr.findIndex(z => z[0] === r[0]) === i)
        .map(([g, t]) => [g, /^\d+$/.test(t) ? t + (a.ml ? ' ml' : ' g') : t]);
      html = `<form class="hoja" data-form="racion">
        <h3>${esc(a.nombre)}</h3><span class="por">Por 100 ${a.ml ? 'ml' : 'g'}: ${n0(a.kcal)} kcal · P ${n1(a.prot)} · C ${n1(a.carb)} · G ${n1(a.grasa)}${a.fuente === 'off' ? ' · Open Food Facts' : a.fuente === 'base' ? ' · tabla' : ''}</span>
        <div class="paso"><button type="button" data-act="menos" aria-label="Menos">−</button>
          <label><input id="gramos" inputmode="decimal" value="${H.g || ''}" aria-label="Cantidad" autocomplete="off"><span>${a.ml ? 'ml' : 'g'}</span></label>
          <button type="button" data-act="masG" aria-label="Más">+</button></div>
        <div class="chips">${raciones.map(([g, t]) => `<button type="button" data-act="racion" data-g="${g}" aria-pressed="${g === H.g}">${esc(t)}</button>`).join('')}</div>
        <div class="total" id="total">${totalHtml(m)}</div>
        <span class="eti">¿En qué comida?</span>${chipsComida(H.m)}
        <div class="fila"><button class="btn" style="flex:1">${H.entrada ? 'Guardar' : 'Añadir a la ' + nombreComida(H.m).toLowerCase()}</button><button type="button" class="btn sec" data-act="${H.entrada ? 'cerrar' : 'volver'}">${H.entrada ? 'Cancelar' : 'Volver'}</button></div>
        ${H.entrada ? `<button type="button" class="btn peligro" data-act="borrarEntrada">Quitar de la ${nombreComida(H.m).toLowerCase()}</button>` : ''}
      </form>`;
    } else if (H.modo === 'scan') {
      html = `<div class="hoja"><h3>Escanear</h3>
        <div id="lector"><div class="marco"></div></div>
        <p class="nota" id="scanNota">Apunta al código de barras del envase. La primera vez, el móvil te pedirá permiso para la cámara.</p>
        <form class="linea2" data-form="codigo"><input class="campo" id="codigoMano" inputmode="numeric" placeholder="O escribe el número del código" autocomplete="off" aria-label="Número del código de barras"><button class="btn">Buscar</button></form>
        <button class="btn sec ancho" data-act="volver">Cancelar</button>
        <p class="nota" style="text-align:center;opacity:.5;font-size:12px">Lector 2 · versión ${VERSION}</p></div>`;
    } else if (H.modo === 'alimento') {
      const a = H.a || {};
      const v = x => x == null || x === '' ? '' : esc(String(x).replace('.', ','));
      html = `<form class="hoja" data-form="alimento"><h3>${a.id ? 'Editar alimento' : 'Alimento a mano'}</h3>
        <input class="campo" id="alNombre" placeholder="Nombre (p. ej. Barrita de proteína)" value="${esc(a.nombre || '')}" aria-label="Nombre" autocomplete="off">
        <span class="eti">Por 100 g, copiado de la etiqueta</span>
        <div class="rejilla cuatro">${[['alK', 'kcal', a.kcal], ['alP', 'proteína', a.prot], ['alC', 'carbos', a.carb], ['alG', 'grasa', a.grasa]].map(([id, t, x]) => `<label class="camp"><input class="campo" id="${id}" inputmode="decimal" value="${v(x)}" autocomplete="off"><span>${t}</span></label>`).join('')}</div>
        <div class="rejilla" style="grid-template-columns:1fr 1fr">
          <label class="camp"><span>Unidad (opcional)</span><input class="campo" id="alU" placeholder="barrita" value="${esc(a.unidad || '')}" autocomplete="off"></label>
          <label class="camp"><span>Gramos de una unidad</span><input class="campo" id="alGU" inputmode="numeric" placeholder="45" value="${a.gUnidad || ''}" autocomplete="off"></label></div>
        <p class="nota">Con la unidad podrás apuntar «1 barrita» sin pesarla.${a.codigo ? ' Código: ' + esc(a.codigo) + '.' : ''}</p>
        <div class="fila"><button class="btn" style="flex:1">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></div>
        ${a.id ? '<button type="button" class="btn peligro" data-act="borrarAlimento">Borrar alimento</button>' : ''}</form>`;
    } else if (H.modo === 'plato') {
      const p = H.p;
      html = `<form class="hoja" data-form="plato"><h3>${p.id && D.platos.some(x => x.id === p.id) ? 'Editar plato' : 'Guardar como plato'}</h3>
        <input class="campo" id="plNombre" value="${esc(p.nombre)}" aria-label="Nombre del plato" autocomplete="off">
        <div class="lista">${p.items.map(([id, g]) => { const a = alimento(id); return a ? `<div class="ali"><div class="txt"><b>${esc(a.nombre)}</b><small>${cant(a, g)} · ${n0(macros(a, g).kcal)} kcal</small></div></div>` : ''; }).join('')}</div>
        <div class="total">${totalHtml(suma(p.items.map(([id, g]) => { const a = alimento(id); return a ? macros(a, g) : { kcal: 0, prot: 0, carb: 0, grasa: 0 }; })))}</div>
        <div class="fila"><button class="btn" style="flex:1">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></div>
        ${D.platos.some(x => x.id === p.id) ? '<button type="button" class="btn peligro" data-act="borrarPlato">Borrar plato</button>' : ''}</form>`;
    } else if (H.modo === 'receta') {
      const r = RECETAS.find(x => x.id === H.r);
      const kc = kcalComida(H.m);
      const items = escalar(r, kc);
      html = `<form class="hoja" data-form="receta">${cabH(r.n)}<p class="receta-nota">${esc(r.nota)}</p>
        <span class="eti">Para tu ${nombreComida(H.m).toLowerCase()} · unas ${n0(kc)} kcal</span>
        <div class="lista">${items.map(([a, g]) => `<div class="ali"><div class="txt"><b>${esc(a.nombre)}</b><small>${cant(a, g)} · ${n0(macros(a, g).kcal)} kcal · P ${n1(macros(a, g).prot)}</small></div></div>`).join('')}</div>
        <div class="total">${totalHtml(totalItems(items))}</div>
        <span class="eti">¿En qué comida?</span>${chipsComida(H.m)}
        <div class="fila"><button class="btn" style="flex:1">Añadir a la ${nombreComida(H.m).toLowerCase()}</button><button type="button" class="btn sec" data-act="guardarReceta">Guardar plato</button></div>
        <button type="button" class="btn sec ancho" data-act="${H.volverA === 'foods' ? 'cerrar' : 'volver'}">${H.volverA === 'foods' ? 'Cerrar' : 'Volver'}</button></form>`;
    } else if (H.modo === 'widget') {
      html = `<div class="hoja"><h3>Código del widget</h3>
        <p class="nota">No he podido copiarlo solo. Mantén pulsado el texto → Seleccionar todo → Copiar, y pégalo en un script nuevo de Scriptable.</p>
        <textarea class="campo" id="codigoWidget" readonly style="height:220px;padding:12px;font:12px/1.4 ui-monospace,monospace;resize:none">${esc(codigoWidget())}</textarea>
        <button class="btn sec ancho" data-act="cerrar">Cerrar</button></div>`;
    } else if (H.modo === 'perfil') {
      html = `<div class="hoja alta">${cabH('Tus datos')}${formPerfil('Guardar y recalcular')}<button class="btn sec ancho" data-act="cerrar">Cancelar</button></div>`;
    } else if (H.modo === 'metaMano') {
      const m = D.meta;
      html = `<form class="hoja" data-form="metaMano"><h3>Meta a mano</h3>
        <p class="nota">Si tu nutricionista o tu plan te dan otros números, ponlos aquí. Las kcal se recalculan solas con los macros.</p>
        <div class="rejilla">${[['mmP', 'proteína (g)', m.prot], ['mmC', 'carbos (g)', m.carb], ['mmG', 'grasa (g)', m.grasa]].map(([id, t, x]) => `<label class="camp"><span>${t}</span><input class="campo" id="${id}" inputmode="numeric" value="${Math.round(x)}" autocomplete="off"></label>`).join('')}</div>
        <div class="total" id="mmTotal"></div>
        <div class="fila"><button class="btn" style="flex:1">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></div></form>`;
    }
    $('velo').innerHTML = html;
    $('velo').hidden = false;
    if (H.modo === 'scan') iniciarLector();
    if (H.modo === 'perfil') pintarResumenPerfil();
    if (H.modo === 'metaMano') totalMetaMano();
  }
  // Título de hoja con una ✕ para cerrar (además de tocar fuera o deslizar hacia abajo).
  const cabH = t => `<div class="cabh"><h3>${esc(t)}</h3><button type="button" class="cerrarX" data-act="cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  const totalHtml = m => `<b>${n0(m.kcal)} <small>kcal</small></b><span>${resumenMacros(m)}</span>`;
  function totalMetaMano() {
    const v = id => parseFloat(String($(id).value).replace(',', '.')) || 0;
    $('mmTotal').innerHTML = `<b>${n0(v('mmP') * 4 + v('mmC') * 4 + v('mmG') * 9)} <small>kcal</small></b>`;
  }

  // Lista de la hoja: sin búsqueda, tus platos y habituales; con búsqueda, lo tuyo + la tabla + Open Food Facts.
  function resultados() {
    const H = hoja;
    const q = (H.busca || '').trim();
    const fila = (a, g, extra) => `<div class="ali"><button class="txt" data-act="elegir" data-id="${esc(a.id)}" ${g ? `data-g="${g}"` : ''}><b>${esc(a.nombre)}</b><small>${g ? cant(a, g) + ' · ' + n0(macros(a, g).kcal) + ' kcal · P ' + n1(macros(a, g).prot) : n0(a.kcal) + ' kcal / 100 g · P ' + n1(a.prot)}</small></button>${extra || ''}</div>`;
    if (!q) {
      const platos = D.platos.map((p, i) => {
        const s = suma(p.items.map(([id, g]) => { const a = alimento(id); return a ? macros(a, g) : { kcal: 0, prot: 0, carb: 0, grasa: 0 }; }));
        return `<div class="ali"><button class="txt" data-act="ponPlato" data-id="${esc(p.id)}"><b>${esc(p.nombre)}</b><small>${p.items.length} cosas · ${n0(s.kcal)} kcal · P ${n0(s.prot)}</small></button><button class="mini" data-act="ponPlato" data-id="${esc(p.id)}" aria-label="Añadir ${esc(p.nombre)}">${ico('mas', 16, 2.6)}</button></div>`;
      }).join('');
      const habituales = D.habituales.map(h => ({ a: alimento(h.alimento), g: h.gramos })).filter(x => x.a).slice(0, 6)
        .map(({ a, g }) => fila(a, g, `<button class="mini" data-act="rapida" data-id="${esc(a.id)}" data-g="${g}" aria-label="Añadir ${esc(a.nombre)}">${ico('mas', 16, 2.6)}</button>`)).join('');
      // Tres ideas de su comida, distintas cada día, ya escaladas a lo que te toca.
      const kc = kcalComida(H.m);
      const todas = recetasPara(H.m);
      const desde = diasEntre('2026-01-01', D.dia) % Math.max(1, todas.length);
      const ideas = todas.slice(desde).concat(todas.slice(0, desde)).slice(0, 3).map(r => {
        const s = totalItems(escalar(r, kc));
        return `<div class="ali"><button class="txt" data-act="verReceta" data-id="${r.id}"><b>${esc(r.n)}</b><small>${n0(s.kcal)} kcal · P ${n0(s.prot)} · ${r.items.length} ingredientes</small></button><button class="mini" data-act="ponReceta" data-id="${r.id}" aria-label="Añadir ${esc(r.n)}">${ico('mas', 16, 2.6)}</button></div>`;
      }).join('');
      return `${platos ? `<div class="grupo"><span class="eti">Mis platos · entran enteros</span><div class="lista">${platos}</div></div>` : ''}
        ${habituales ? `<div class="grupo"><span class="eti">Habituales · con tu ración de siempre</span><div class="lista">${habituales}</div></div>`
          : '<p class="nota">Busca arriba o escanea un código. Lo que apuntes a menudo saldrá aquí con tu ración de siempre, para apuntarlo con un toque.</p>'}
        ${ideas ? `<div class="grupo"><span class="eti">Ideas para ${OBJETIVO[objetivo()].nombre.toLowerCase()} · unas ${n0(kc)} kcal</span><div class="lista">${ideas}</div></div>` : ''}`;
    }
    const locales = buscarLocal(q);
    const off = H.off && H.off.q === q ? H.off : null;
    const enOff = off && off.lista ? off.lista.filter(p => !D.alimentos.some(a => a.codigo && a.codigo === p.codigo)) : [];
    return `${locales.length ? `<div class="lista">${locales.map(a => fila(a, 0, a.fuente === 'base' ? '' : `<span class="fuente ${a.fuente}">${a.fuente === 'off' ? 'Código' : 'Tuyo'}</span>`)).join('')}</div>` : `<p class="nota">No está entre tus alimentos ni en la tabla.</p>`}
      <div class="grupo"><span class="eti">En Open Food Facts</span>
      ${!off ? `<button class="btn sec ancho" data-act="buscarOFF">Buscar «${esc(q)}» en Open Food Facts</button>`
        : off.cargando ? '<p class="nota">Buscando…</p>'
        : off.error ? `<p class="nota">${esc(off.error)}</p><button class="btn sec ancho" data-act="buscarOFF">Probar otra vez</button>`
        : enOff.length ? `<div class="lista">${enOff.map((p, i) => `<div class="ali"><button class="txt" data-act="elegirOFF" data-i="${off.lista.indexOf(p)}"><b>${esc(p.nombre)}</b><small>${n0(p.kcal)} kcal / 100 g · P ${n1(p.prot)}</small></button></div>`).join('')}</div>`
        : '<p class="nota">Nada con ese nombre. Prueba con otra palabra, escanea el código o créalo a mano en Foods.</p>'}</div>`;
  }

  // ---------- Escáner ----------

  // Lector ZXing (zxing-cpp en WebAssembly): lee EAN/UPC mucho mejor que html5-qrcode, sobre todo en
  // el iPhone, que no trae detector propio. Cámara en alta resolución, foco continuo, recorte del marco
  // y dígito de control comprobado; da el código por bueno cuando lo lee dos veces igual.
  const LECTOR_JS = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js';
  let detectorP = null;
  function detector() {
    return detectorP || (detectorP = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = LECTOR_JS;
      s.onload = () => {
        try {
          const api = window.BarcodeDetectionAPI;
          const d = new api.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
          if (api.prepareZXingModule) Promise.resolve(api.prepareZXingModule({ fireImmediately: true })).catch(() => {});
          ok(d);
        } catch (e) { mal(e); }
      };
      s.onerror = () => mal(new Error('sin red'));
      document.head.append(s);
    }).catch(e => { detectorP = null; throw e; }));
  }
  // Se prepara en segundo plano al abrir la app, para que la primera vez el escáner ya esté listo.
  setTimeout(() => detector().catch(() => {}), 2500);

  // Versión de la app: si en GitHub hay una más nueva que la que guardó el iPhone, se recarga sola.
  const VERSION = '2026-11-09b';
  if (/github\.io$/.test(location.hostname)) setTimeout(async () => {
    try {
      const t = await (await fetch(location.pathname + '?comprobar=' + Date.now(), { cache: 'no-store' })).text();
      const v = (t.match(/const VERSION = '([^']+)'/) || [])[1];
      if (v && v !== VERSION && sessionStorage.getItem('cherry.recargada') !== v) {
        sessionStorage.setItem('cherry.recargada', v);
        location.replace(location.pathname + '?v=' + v);
      }
    } catch (e) {}
  }, 1200);

  function controlOk(c, formato) {
    if (formato === 'upc_e') return c.length === 8;
    if (![8, 12, 13].includes(c.length)) return false;
    const d = c.split('').map(Number), chk = d.pop();
    const suma = d.reverse().reduce((t, x, i) => t + x * (i % 2 ? 1 : 3), 0);
    return (10 - suma % 10) % 10 === chk;
  }

  let lector = null;
  async function iniciarLector() {
    pararLector();
    const caja = $('lector');
    const sesion = { activo: true, stream: null, timer: 0 };
    lector = sesion;
    const decir = t => { if (lector === sesion && $('scanNota')) $('scanNota').textContent = t; };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return decir('Este navegador no deja usar la cámara. Escribe el número del código.');
    let det;
    const camara = navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    try {
      [det, sesion.stream] = await Promise.all([detector(), camara]);
    } catch (e) {
      camara.then(st => st.getTracks().forEach(t => t.stop())).catch(() => {});
      if (e && /sin red/.test(e.message)) return decir('No he podido cargar el lector (¿sin cobertura?). Escribe el número del código.');
      return decir('No puedo usar la cámara (' + (e && (e.name || e.message) || e) + '). Dale permiso en Ajustes → Safari → Cámara, o escribe el número.');
    }
    if (!sesion.activo) { sesion.stream.getTracks().forEach(t => t.stop()); return; }
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.muted = true; video.autoplay = true;
    video.srcObject = sesion.stream;
    caja.prepend(video);
    video.play().catch(() => {});
    const track = sesion.stream.getVideoTracks()[0];
    try {
      const cap = track.getCapabilities ? track.getCapabilities() : {};
      const adv = {};
      if (cap.focusMode && cap.focusMode.includes('continuous')) adv.focusMode = 'continuous';
      if (cap.zoom && cap.zoom.max >= 1.5) adv.zoom = Math.max(cap.zoom.min || 1, 1.5);
      if (Object.keys(adv).length) await track.applyConstraints({ advanced: [adv] });
      if (cap.torch) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'linterna'; b.textContent = 'Linterna';
        let on = false;
        b.onclick = () => { on = !on; track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {}); b.textContent = on ? 'Apagar luz' : 'Linterna'; };
        caja.append(b);
      }
    } catch (e) {}
    decir('Pon el código dentro del marco, a un palmo y con luz, con la línea roja cruzando las barras.');

    const lienzo = document.createElement('canvas');
    const ctx = lienzo.getContext('2d', { willReadFrequently: true });
    const vistos = {};
    const inicio = Date.now();
    let n = 0, avisado = false;
    const paso = async () => {
      if (!sesion.activo) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (video.readyState >= 2 && vw) {
        // Parte del vídeo que se ve en la caja (object-fit: cover) y, dentro, la franja del marco con margen.
        const W = caja.clientWidth || 1, H = caja.clientHeight || 1;
        const k = Math.max(W / vw, H / vh), visW = W / k, visH = H / k;
        const todo = n++ % 4 === 3;               // de vez en cuando, toda la imagen por si el código está fuera del marco
        const sw = todo ? vw : visW * 0.96, sh = todo ? vh : visH * 0.6;
        const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
        const esc = Math.min(1, 1600 / Math.max(sw, sh));
        lienzo.width = Math.round(sw * esc); lienzo.height = Math.round(sh * esc);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, lienzo.width, lienzo.height);
        try {
          const res = await det.detect(lienzo);
          for (const r of res) {
            const c = String(r.rawValue || '').replace(/\D/g, '');
            if (!controlOk(c, r.format)) continue;
            vistos[c] = (vistos[c] || 0) + 1;
            if (vistos[c] >= 2 && sesion.activo) {
              const m = caja.querySelector('.marco'); if (m) m.classList.add('ok');
              if (navigator.vibrate) navigator.vibrate(60);
              pararLector();
              return porCodigo(c);
            }
          }
        } catch (e) {}
        if (!avisado && Date.now() - inicio > 9000) { avisado = true; decir('¿No lo pilla? Aleja un poco el móvil para que enfoque, evita reflejos y mantén las barras rectas. O escribe el número.'); }
      }
      if (sesion.activo) sesion.timer = setTimeout(paso, 40);
    };
    paso();
  }
  function pararLector() {
    if (!lector) return;
    const s = lector;
    lector = null;
    s.activo = false;
    clearTimeout(s.timer);
    if (s.stream) s.stream.getTracks().forEach(t => t.stop());
  }
  async function porCodigo(codigo) {
    codigo = String(codigo).replace(/\D/g, '');
    if (!codigo) return avisar('Escribe el número que hay debajo de las barras');
    if (codigo.length < 8) return avisar('«' + codigo + '» es corto: un código de barras tiene 8 o 13 cifras');
    const ya = D.alimentos.find(a => a.codigo === codigo);
    if (ya) return abrirRacion(ya, ya.gUnidad || 100);
    if ($('scanNota')) $('scanNota').textContent = 'Buscando ' + codigo + ' en Open Food Facts…';
    cargando(true);
    let p = null, error = '';
    try { p = await offCodigo(codigo); } catch (e) { error = 'No he podido conectar con Open Food Facts'; }
    cargando(false);
    if (!hoja) return;
    if (p) {
      const a = guardarDeOFF(p);
      avisar('Encontrado y guardado en tus alimentos');
      return abrirRacion(a, a.gUnidad || 100);
    }
    avisar(error || 'Ese producto no está en Open Food Facts: créalo copiando la etiqueta');
    if (!error) abrirHoja({ modo: 'alimento', a: { codigo }, m: hoja.m, volverA: 'lista' });
  }

  function abrirRacion(a, g, extra) {
    abrirHoja({ ...(hoja || {}), modo: 'racion', a, g, ...(extra || {}) });
  }

  // ---------- Apuntar ----------

  function apuntar(items, comida, texto) {
    const lista = items.map(([a, g]) => entrada(a, g));
    enviar('apuntar', { dia: D.dia, comida, items: lista });
    cerrarHoja();
    if (vista !== 'today') { vista = 'today'; guardarVista(); pintar(); }
    avisar(`${texto} a la ${nombreComida(comida).toLowerCase()}`, () => lista.forEach(x => enviar('borrarEntrada', { id: x.id })));
  }
  // «2 huevos», «1 lata de atún al natural», «150 g de pechuga de pollo».
  function describir(a, g) {
    const c = cant(a, g);
    const nombre = a.nombre.replace(/ \(.*\)$/, '').toLowerCase();
    return a.unidad && !/ (g|ml)$/.test(c) && sinAcentos(nombre).includes(sinAcentos(a.unidad)) ? c : c + ' de ' + nombre;
  }
  const que = describir;

  // ---------- Toques ----------

  const ACT = {
    recargar: () => cargar(),
    dia: t => {
      const n = +t.dataset.n;
      cargar(n === 0 ? D.hoy : diaMas(D.dia, n));
    },
    abrir: t => abrirHoja({ modo: 'lista', m: t.dataset.m }),
    comida: t => { hoja.m = t.dataset.m; pintarHoja(); },
    escanear: () => abrirHoja({ ...(hoja || { m: siguienteComida() }), modo: 'scan' }),
    volver: () => {
      pararLector();
      if (hoja.volverA === 'foods' || !hoja.m) return cerrarHoja();
      abrirHoja({ ...hoja, modo: 'lista' });
    },
    cerrar: () => cerrarHoja(),
    elegir: t => { const a = alimento(t.dataset.id); if (a) abrirRacion(a, +t.dataset.g || a.gUnidad || 100); },
    elegirOFF: t => { const p = hoja.off.lista[+t.dataset.i]; const a = guardarDeOFF(p); abrirRacion(a, a.gUnidad || 100); },
    rapida: t => { const a = alimento(t.dataset.id); if (a) apuntar([[a, +t.dataset.g]], hoja.m, 'Añadido: ' + que(a, +t.dataset.g)); },
    ponPlato: t => {
      const p = D.platos.find(x => x.id === t.dataset.id);
      const items = p.items.map(([id, g]) => [alimento(id), g]).filter(x => x[0]);
      if (!items.length) return avisar('Los alimentos de ese plato ya no existen');
      apuntar(items, hoja.m, `Añadido «${p.nombre}»`);
    },
    racion: t => { hoja.g = +t.dataset.g; pintarHoja(); },
    menos: () => { hoja.g = Math.max(0, (leerG() || 0) - paso()); pintarHoja(); },
    masG: () => { hoja.g = (leerG() || 0) + paso(); pintarHoja(); },
    entrada: t => {
      const e = D.registro.find(x => x.id === t.dataset.id);
      if (!e) return;
      // Si el alimento ya no existe, se edita con lo que guardó la entrada.
      const a = alimento(e.alimento) || { id: e.alimento, nombre: e.nombre, kcal: e.kcal / e.gramos * 100, prot: e.prot / e.gramos * 100, carb: e.carb / e.gramos * 100, grasa: e.grasa / e.gramos * 100, unidad: '', gUnidad: 0 };
      abrirHoja({ modo: 'racion', a, g: e.gramos, m: e.comida, entrada: e.id });
    },
    borrarEntrada: t => {
      if (!seguro(t)) return;
      const e = D.registro.find(x => x.id === hoja.entrada);
      enviar('borrarEntrada', { id: hoja.entrada });
      cerrarHoja();
      if (e) avisar('Quitado: ' + e.nombre, () => enviar('apuntar', { dia: D.dia, comida: e.comida, items: [{ ...e, id: nid('r') }] }));
    },
    tip: () => {
      const s = sugerencia(suma(D.registro));
      if (s) apuntar(s.items.map(x => [x.a, x.g]), s.comida, 'Añadido: ' + s.items.map(x => describir(x.a, x.g)).join(' y '));
    },
    guardarPlato: t => {
      const items = D.registro.filter(x => x.comida === t.dataset.m && alimento(x.alimento)).map(x => [x.alimento, x.gramos]);
      if (items.length < 2) return avisar('Hace falta que los alimentos sigan existiendo');
      abrirHoja({ modo: 'plato', p: { id: nid('p'), nombre: nombreComida(t.dataset.m) + ' de siempre', items } });
    },
    verPlato: t => { const p = D.platos.find(x => x.id === t.dataset.id); if (p) abrirHoja({ modo: 'plato', p: { ...p } }); },
    borrarPlato: t => { if (!seguro(t)) return; enviar('borrarPlato', { id: hoja.p.id }); cerrarHoja(); avisar('Plato borrado'); },
    nuevoAlimento: () => abrirHoja({ modo: 'alimento', a: {}, volverA: 'foods' }),
    editarAlimento: t => { const a = D.alimentos.find(x => x.id === t.dataset.id); if (a) abrirHoja({ modo: 'alimento', a: { ...a }, volverA: 'foods' }); },
    borrarAlimento: t => {
      if (!seguro(t)) return;
      enviar('borrarAlimento', { id: hoja.a.id });
      cerrarHoja();
      avisar('Alimento borrado. Lo que ya apuntaste se queda igual.');
    },
    buscarOFF: async () => {
      const q = (hoja.busca || '').trim();
      if (!q) return;
      hoja.off = { q, cargando: true };
      $('resultados').innerHTML = resultados();
      try {
        const lista = await offBuscar(q);
        if (hoja && hoja.off && hoja.off.q === q) hoja.off = { q, lista };
      } catch (e) {
        if (hoja && hoja.off) hoja.off = { q, error: 'Open Food Facts no contesta ahora. Prueba en un rato o escanea el código.' };
      }
      if (hoja && hoja.modo === 'lista') $('resultados').innerHTML = resultados();
    },
    perfil: () => { perfilForm = { objetivo: 'ganar', actividad: 'medio', ...D.perfil, peso: (D.pesos[D.pesos.length - 1] || {}).kg || '' }; abrirHoja({ modo: 'perfil' }); },
    perfilChip: t => {
      perfilForm[t.dataset.campo] = t.dataset.v;
      t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t));
      pintarResumenPerfil();
    },
    metaMano: () => abrirHoja({ modo: 'metaMano' }),
    menu: t => { menuSel = t.dataset.v; menuOtro = 0; pintar(); },
    otroMenu: () => { menuOtro++; pintar(); },
    verReceta: t => abrirHoja(hoja ? { ...hoja, modo: 'receta', r: t.dataset.id, volverA: 'lista' } : { modo: 'receta', r: t.dataset.id, m: t.dataset.m, volverA: 'foods' }),
    ponReceta: t => {
      const r = RECETAS.find(x => x.id === t.dataset.id);
      apuntar(escalar(r, kcalComida(hoja.m)), hoja.m, `Añadido «${r.n}»`);
    },
    guardarReceta: () => {
      const r = RECETAS.find(x => x.id === hoja.r);
      enviar('plato', { id: nid('p'), nombre: r.n, items: escalar(r, kcalComida(hoja.m)).map(([a, g]) => [a.id, g]) });
      avisar('Guardado en tus platos: lo tienes arriba al pulsar +');
    },
    agua: t => enviar('diario', { dia: D.dia, agua: Math.max(0, D.diario.agua + Number(t.dataset.ml)) }),
    creatina: () => {
      const si = !D.diario.creatina;
      enviar('diario', { dia: D.dia, creatina: si });
      if (si && D.dia === D.hoy) { const r = racha(D.diarios, D.hoy); avisar(r > 1 ? `Creatina apuntada · ${r} días seguidos` : 'Creatina apuntada'); }
    },
    copiarWidget: () => {
      const texto = codigoWidget();
      const fallo = () => abrirHoja({ modo: 'widget' });
      try {
        navigator.clipboard.writeText(texto).then(() => avisar('Copiado. Pégalo en un script nuevo de Scriptable'), fallo);
      } catch (e) { fallo(); }
    },
    aplicarAjuste: () => {
      const aj = revisarAjuste(D.pesos, D.meta, D.perfil.objetivo, D.hoy);
      if (!aj.nueva) return;
      enviar('meta', { ...aj.nueva, motivo: (aj.cambio > 0 ? '+' : '') + aj.cambio + ' kcal (ritmo ' + n1(aj.ritmo) + ' kg/sem)' });
      avisar('Nueva meta: ' + n0(aj.nueva.kcal) + ' kcal');
    },
    mantenerMeta: () => {
      const m = D.meta;
      enviar('meta', { kcal: m.kcal, prot: m.prot, carb: m.carb, grasa: m.grasa, motivo: 'revisada, sin cambios' });
      avisar('Perfecto. La vuelvo a revisar en 2 semanas');
    },
  };
  const siguienteComida = () => (COMIDAS.find(([id]) => !D.registro.some(x => x.comida === id)) || COMIDAS[3])[0];
  const leerG = () => parseFloat(String(($('gramos') || {}).value || '').replace(',', '.'));
  const paso = () => (hoja.a.gUnidad && hoja.a.gUnidad < 30 ? hoja.a.gUnidad : 10);
  // Los botones de borrar piden un segundo toque.
  function seguro(t) {
    if (t.classList.contains('seguro')) return true;
    t.classList.add('seguro');
    t.dataset.texto = t.textContent;
    t.textContent = 'Toca otra vez para confirmar';
    setTimeout(() => { if (t.isConnected) { t.classList.remove('seguro'); t.textContent = t.dataset.texto; } }, 3000);
    return false;
  }

  document.addEventListener('click', e => {
    if (e.target === $('velo')) return cerrarHoja();
    const t = e.target.closest('[data-tab],[data-act]');
    if (!t || t.disabled) return;
    if (t.dataset.tab) {
      vista = t.dataset.tab;
      guardarVista();
      pintar();
      $('vista').scrollTop = 0;
      return;
    }
    if (ACT[t.dataset.act]) {
      e.preventDefault();
      ACT[t.dataset.act](t);
    }
  });
  $('mas').innerHTML = ico('mas', 20, 2.4);
  $('mas').onclick = () => {
    if (vista === 'foods') return ACT.nuevoAlimento();
    if (vista === 'progress') return $('peso') && $('peso').focus();
    abrirHoja({ modo: 'lista', m: siguienteComida() });
  };
  // Deslizar la hoja hacia abajo la cierra (solo si su contenido está arriba del todo).
  let arrastre = null;
  $('velo').addEventListener('touchstart', e => {
    const h = e.target.closest('.hoja');
    if (!h || h.scrollTop > 0 || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    arrastre = { h, y: e.touches[0].clientY, d: 0 };
  }, { passive: true });
  $('velo').addEventListener('touchmove', e => {
    if (!arrastre) return;
    arrastre.d = Math.max(0, e.touches[0].clientY - arrastre.y);
    if (arrastre.h.scrollTop > 0) { arrastre.h.style.transform = ''; arrastre = null; return; }
    arrastre.h.style.transform = `translateY(${arrastre.d}px)`;
  }, { passive: true });
  $('velo').addEventListener('touchend', () => {
    if (!arrastre) return;
    const { h, d } = arrastre;
    arrastre = null;
    if (d > 110) cerrarHoja();
    else { h.style.transition = 'transform .2s'; h.style.transform = ''; setTimeout(() => { h.style.transition = ''; }, 220); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && hoja) cerrarHoja(); });
  $('deshacer').onclick = () => { if (deshacer) deshacer(); deshacer = null; $('toast').classList.remove('ver'); };

  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'buscar') { hoja.busca = e.target.value; $('resultados').innerHTML = resultados(); }
    if (id === 'gramos') { hoja.g = leerG() || 0; $('total').innerHTML = totalHtml(macros(hoja.a, hoja.g)); }
    if (id === 'filtro') { const q = sinAcentos(e.target.value.trim()); document.querySelectorAll('#listaFoods .ali').forEach(r => { r.hidden = !r.dataset.nombre.includes(q); }); }
    if (/^pf/.test(id)) pintarResumenPerfil();
    if (/^mm/.test(id)) totalMetaMano();
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    const num = id => parseFloat(String($(id).value).replace(',', '.'));
    if (f === 'buscar') { document.activeElement.blur(); if (hoja.busca && hoja.busca.trim()) ACT.buscarOFF(); }
    if (f === 'racion') {
      const g = leerG();
      if (!(g > 0)) return avisar('Pon una cantidad');
      if (hoja.entrada) {
        enviar('editarEntrada', { id: hoja.entrada, gramos: Math.round(g), comida: hoja.m });
        cerrarHoja();
        return avisar('Guardado');
      }
      apuntar([[hoja.a, g]], hoja.m, 'Añadido: ' + que(hoja.a, g));
    }
    if (f === 'codigo') porCodigo($('codigoMano').value);
    if (f === 'receta') {
      const r = RECETAS.find(x => x.id === hoja.r);
      apuntar(escalar(r, kcalComida(hoja.m)), hoja.m, `Añadido «${r.n}»`);
    }
    if (f === 'alimento') {
      const a = {
        id: hoja.a.id || nid('a'), nombre: $('alNombre').value.trim(), kcal: num('alK'), prot: num('alP') || 0, carb: num('alC') || 0, grasa: num('alG') || 0,
        unidad: $('alU').value.trim(), gUnidad: Math.round(num('alGU')) || 0, ml: !!hoja.a.ml, codigo: hoja.a.codigo || '', fuente: hoja.a.fuente || 'tuyo',
      };
      if (!a.nombre) return avisar('Pon un nombre');
      if (!(a.kcal >= 0 && a.kcal <= 950)) return avisar('Las kcal por 100 g van de 0 a 950');
      if (a.gUnidad && !a.unidad) a.unidad = 'unidad';
      enviar('alimento', a);
      if (hoja.m && hoja.volverA === 'lista') return abrirRacion(a, a.gUnidad || 100, { volverA: '' });
      cerrarHoja();
      avisar('Guardado en tus alimentos');
    }
    if (f === 'plato') {
      const nombre = $('plNombre').value.trim();
      if (!nombre) return avisar('Pon un nombre al plato');
      enviar('plato', { ...hoja.p, nombre });
      cerrarHoja();
      avisar(`Plato guardado: «${nombre}»`);
    }
    if (f === 'peso') {
      const kg = num('peso');
      if (!(kg > 30 && kg < 250)) return avisar('Escribe tu peso en kg, por ejemplo 72,4');
      enviar('peso', { dia: D.hoy, kg: Math.round(kg * 10) / 10 });
      avisar('Peso guardado: ' + n1(kg) + ' kg');
    }
    if (f === 'perfil') {
      const m = leerPerfil();
      if (!m) return;
      const p = perfilForm;
      const primera = !D.meta;
      enviar('perfil', { sexo: p.sexo, edad: Math.round(p.edad), altura: Math.round(p.altura), actividad: p.actividad, objetivo: p.objetivo, peso: Math.round(p.peso * 10) / 10, meta: { kcal: m.kcal, prot: m.prot, carb: m.carb, grasa: m.grasa } });
      cerrarHoja();
      if (primera) { vista = 'today'; guardarVista(); pintar(); }
      avisar(primera ? 'Listo. Apunta lo primero que comas con el +' : 'Meta recalculada: ' + n0(m.kcal) + ' kcal');
    }
    if (f === 'metaMano') {
      const m = { prot: Math.round(num('mmP')), carb: Math.round(num('mmC')), grasa: Math.round(num('mmG')) };
      m.kcal = m.prot * 4 + m.carb * 4 + m.grasa * 9;
      if (!(m.kcal >= 1000 && m.kcal <= 6000)) return avisar('Con esos macros salen ' + n0(m.kcal || 0) + ' kcal: deben quedar entre 1000 y 6000');
      enviar('meta', { ...m, motivo: 'a mano' });
      cerrarHoja();
      avisar('Meta guardada: ' + n0(m.kcal) + ' kcal');
    }
  });

  function avisar(t, undo) {
    $('toastTxt').textContent = t;
    deshacer = undo || null;
    $('deshacer').hidden = !undo;
    $('toast').classList.add('ver');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => $('toast').classList.remove('ver'), undo ? 4500 : 3000);
  }
  // El código de Scriptable vive en <script id="widgetCodigo">; aquí se le pone tu servidor y tu clave.
  const codigoWidget = () => $('widgetCodigo').textContent.trim()
    .replace('__URL__', URL_API + '?accion=widget&k=' + encodeURIComponent(K))
    .replace('__APP__', location.origin + location.pathname);
  function guardarVista() { try { localStorage.setItem('cherry.vista', vista); } catch (e) {} }

  function pantallaClave(error) {
    quitarSplash();
    $('nav').hidden = true;
    $('mas').hidden = true;
    $('titulo').textContent = 'Cherry';
    $('sub').innerHTML = '';
    if (!URL_API) {
      $('vista').innerHTML = `<div class="tarjeta"><p><b>Falta conectar tu servidor.</b> Abre Cherry con el enlace o el código QR que te dio tu servidor de Google al instalarlo. Solo hace falta la primera vez.</p></div>`;
      return;
    }
    $('vista').innerHTML = `<form class="tarjeta" id="formClave" autocomplete="off">
        <p>${error ? esc(error) + '. ' : ''}Escribe tu clave para entrar (solo la primera vez).</p>
        <input class="campo" name="clave" placeholder="Clave" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn">Entrar</button></form>`;
    $('formClave').onsubmit = e => {
      e.preventDefault();
      const c = new FormData(e.target).get('clave').trim();
      if (c) location.href = location.pathname + '?k=' + encodeURIComponent(c);
    };
  }

  // ---------- Arranque ----------

  // La dirección conserva ?api y ?k: el icono de la pantalla de inicio del iPhone tiene su propio almacenamiento
  // y los necesita la primera vez que se abre.
  if (!URL_API || !K) pantallaClave();
  else {
    const c = leerCache();
    if (c && c.hoy === hoyLocal()) { D = c; pintar(); }
    if (cola.length) vaciar();
    else cargar(hoyLocal());
  }
</script>
</body>
</html>
