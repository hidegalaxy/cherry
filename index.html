<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry</title>
<!-- Icono y pantalla completa al añadirla a la pantalla de inicio. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cherry">
<meta name="theme-color" content="#0d0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Familia Lima/Plum: una pantalla de móvil oscura, mucho aire, un solo color fuerte (cereza) y un color fijo por macro. */
  :root {
    color-scheme: dark;
    --bg: #0d0b0c;
    --surface: #171415;
    --line: #251f21;
    --track: #2e272a;
    --text: #f6f2f2;
    --muted: #a1979a;
    --dim: #6e6467;
    --cherry: #ff5c7a;
    --ink: #0d0b0c;
    --pro: #6fb7ff;
    --car: #ffcf5a;
    --fat: #5ee0b0;
    --agua: #5fd4f4;
    --font: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); overscroll-behavior: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cherry); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
  @media (min-width: 640px) {
    body { display: flex; align-items: center; justify-content: center; padding-block: 24px; }
    .app { height: min(900px, 100%); width: 420px; border: 1px solid var(--line); border-radius: 40px; }
  }
  .carga { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 2px; overflow: hidden; z-index: 7; opacity: 0; transition: opacity .2s; }
  .carga.ver { opacity: 1; }
  .carga::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--cherry); animation: carga 1s ease-in-out infinite; }
  @keyframes carga { from { left: -35%; } to { left: 100%; } }

  header.cab { display: flex; align-items: center; gap: 12px; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px)); }
  .cab h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .cab .sub { color: var(--muted); font-size: 15px; flex: 1; padding-top: 6px; display: flex; align-items: center; gap: 2px; min-width: 0; }
  .cab .sub button { border: 0; background: none; color: var(--muted); width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
  .cab .sub button:disabled { opacity: .25; }
  .cab .sub .volver { width: auto; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--cherry); }
  .mas { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--cherry); color: var(--ink); display: grid; place-items: center; flex: 0 0 42px; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
  .eti { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .num { font-variant-numeric: tabular-nums; }
  .nota { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
  .grupo { display: flex; flex-direction: column; gap: 6px; }

  /* Today */
  .hero { background: var(--cherry); color: var(--ink); border-radius: 26px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
  .hero.pasado { background: var(--car); }
  .hero .eti { color: rgba(13,11,12,.65); }
  .hero h2 { margin: 0; font-size: 44px; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero h2 small { font-size: 18px; letter-spacing: 0; font-weight: 600; opacity: .7; }
  .hero p { margin: 0; font-weight: 600; opacity: .75; font-size: 14px; }
  .pista { height: 8px; border-radius: 4px; background: rgba(13,11,12,.18); overflow: hidden; }
  .pista em { display: block; height: 100%; border-radius: 4px; background: var(--ink); transition: width .5s ease; }

  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .macro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .macro b { font-size: 13px; font-weight: 600; color: var(--muted); }
  .macro span { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .macro span small { color: var(--dim); font-weight: 500; }
  .macro i { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; display: block; }
  .macro i em { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; }

  .comidas { display: flex; flex-direction: column; }
  .comida { border-top: 1px solid var(--line); padding: 12px 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .comida .fila1 { display: flex; align-items: center; gap: 10px; }
  .comida .fila1 b { flex: 1; font-weight: 600; font-size: 17px; }
  .comida .fila1 span { font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mini { width: 34px; height: 34px; border-radius: 11px; border: 0; background: var(--track); color: var(--cherry); display: grid; place-items: center; flex: 0 0 34px; }
  .item { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); padding: 5px 0; background: none; border: 0; width: 100%; text-align: left; }
  .item span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item.nuevo { animation: entra .5s ease; color: var(--text); }
  .vacio { font-size: 14px; color: var(--dim); padding: 2px 0; }
  .enlace { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--cherry); font-size: 13px; font-weight: 600; }
  @keyframes entra { from { opacity: 0; transform: translateY(-6px); } }

  .tip { border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
  .tip p { margin: 0; line-height: 1.5; }
  .tip b { color: var(--pro); font-weight: 600; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--cherry); color: var(--ink); font-weight: 700; }
  .btn.sec { background: none; border: 1px solid var(--track); color: var(--text); font-weight: 600; }
  .btn.peligro { background: none; border: 1px solid var(--track); color: var(--cherry); font-weight: 600; }
  .btn.peligro.seguro { background: var(--cherry); color: var(--ink); }
  .btn.ancho { width: 100%; height: 50px; }
  .btn:disabled { opacity: .4; }

  .rapido { display: flex; align-items: center; gap: 10px; border: 1px solid var(--track); border-radius: 18px; padding: 0 8px 0 16px; background: var(--bg); }
  .rapido input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: none; font-size: 16px; }
  .rapido input::placeholder { color: var(--dim); }
  .rapido button { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--track); display: grid; place-items: center; color: var(--cherry); flex: 0 0 38px; }

  /* Listas de alimentos */
  .lista { display: flex; flex-direction: column; }
  .ali { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ali:last-child { border-bottom: 0; }
  .ali .txt { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
  .ali .txt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ali .txt small { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fuente { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: var(--track); color: var(--muted); white-space: nowrap; }
  .fuente.off { color: var(--car); }
  .fuente.tuyo { color: var(--cherry); }

  /* Progress */
  .tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .tarjeta .grande { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tarjeta .grande b { font-size: 38px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(94,224,176,.14); color: var(--fat); white-space: nowrap; }
  .chip.aviso { background: rgba(255,207,90,.14); color: var(--car); }
  .chip.gris { background: var(--track); color: var(--muted); }
  .tarjeta p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .tarjeta p b { color: var(--text); font-weight: 600; }
  svg.graf { width: 100%; height: auto; display: block; }
  svg.graf text { fill: var(--dim); font: 500 10px var(--font); }
  .linea2 { display: flex; gap: 8px; }
  .linea2 .campo { flex: 1; min-width: 0; }
  .objetivos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .objetivos div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .objetivos b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .objetivos span { font-size: 12px; color: var(--muted); }

  nav { display: flex; border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav button { flex: 1; border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 4px; font-size: 11px; font-weight: 600; }
  nav button[aria-current] { color: var(--cherry); }

  /* Hojas */
  .velo { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; z-index: 5; }
  .hoja { width: 100%; background: var(--surface); border-radius: 28px 28px 0 0; border-top: 1px solid var(--track); padding: 20px max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; }
  .hoja.alta { height: 86%; }
  .hoja h3 { margin: 0; font-size: 22px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .hoja::before { content: ''; align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--track); margin: -8px 0 -4px; flex: 0 0 auto; }
  .cabh { display: flex; align-items: center; gap: 12px; }
  .cabh h3 { flex: 1; min-width: 0; }
  .cerrarX { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; border: 0; background: var(--track); color: var(--text); display: grid; place-items: center; }
  .hoja .por { color: var(--muted); font-size: 13px; margin-top: -8px; font-variant-numeric: tabular-nums; }
  .campo { width: 100%; height: 48px; border: 1px solid var(--track); background: var(--bg); border-radius: 14px; padding: 0 14px; outline: none; font-size: 16px; }
  .campo:focus { border-color: var(--muted); }
  label.camp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  label.camp span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .rejilla.cuatro { grid-template-columns: repeat(4, 1fr); }
  .rejilla .campo { padding: 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { min-height: 38px; padding: 4px 14px; border-radius: 12px; border: 1px solid var(--track); background: none; font-weight: 600; font-size: 14px; }
  .chips button small { display: block; font-weight: 500; font-size: 11px; opacity: .7; }
  .chips button[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
  .paso { display: flex; align-items: center; gap: 10px; }
  .paso button { width: 52px; height: 52px; border-radius: 16px; border: 1px solid var(--track); background: none; font-size: 24px; font-weight: 500; flex: 0 0 52px; }
  .paso label { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; height: 52px; border-radius: 16px; background: var(--bg); border: 1px solid var(--track); padding-top: 8px; min-width: 0; }
  .paso input { width: 50%; border: 0; background: none; outline: none; text-align: right; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .paso label span { color: var(--muted); font-weight: 600; width: 50%; }
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-radius: 16px; background: var(--bg); }
  .total b { font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .total b small { font-size: 15px; color: var(--muted); letter-spacing: 0; }
  .total span { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .p { color: var(--pro); } .c { color: var(--car); } .g { color: var(--fat); }
  #lector { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: #000; }
  #lector video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #lector .marco { position: absolute; left: 8%; right: 8%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; transition: border-color .15s; }
  #lector .marco::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--cherry); opacity: .85; }
  #lector .marco.ok { border-color: var(--cherry); }
  #lector .linterna { position: absolute; right: 10px; bottom: 10px; height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-weight: 600; }

  /* Bienvenida */
  .bienvenida h2 { margin: 0; font-size: 26px; letter-spacing: -.03em; text-wrap: balance; }
  .bienvenida p { margin: 0; color: var(--muted); line-height: 1.5; }
  .resumen { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .resumen b { font-size: 26px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

  .toast { position: absolute; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--ink); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none; z-index: 8; display: flex; justify-content: space-between; gap: 10px; }
  .toast.ver { opacity: 1; transform: none; pointer-events: auto; }
  .toast button { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; text-decoration: underline; }

  /* Pantalla de carga: las dos cerezas se balancean del rabito mientras llegan tus datos. */
  .splash { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .45s ease; }
  .splash.fuera { opacity: 0; pointer-events: none; }
  .splash .logo { width: 108px; height: 108px; border-radius: 28px; background: var(--cherry); display: grid; place-items: center; transition: transform .45s ease; }
  .splash.fuera .logo { transform: scale(1.15); }
  .splash .logo svg { transform-origin: 56% 18%; animation: balanceo 1.6s ease-in-out infinite; }
  .splash .nombre { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .splash .puntos { display: flex; gap: 8px; height: 12px; }
  .splash .puntos i { width: 10px; height: 10px; border-radius: 5px; background: var(--cherry); animation: bote 1s ease-in-out infinite; }
  .splash .puntos i:nth-child(2) { animation-delay: .15s; background: var(--pro); }
  .splash .puntos i:nth-child(3) { animation-delay: .3s; background: var(--car); }
  .splash .puntos i:nth-child(4) { animation-delay: .45s; background: var(--fat); }
  .splash .frase { font-size: 14px; color: var(--muted); height: 20px; transition: opacity .25s; }
  @keyframes balanceo { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes bote { 0%, 100% { transform: translateY(2px); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }

  /* Agua y creatina */
  .habitos { display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px; }
  .hab { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hab .val { font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hab .val small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .vasos { display: flex; gap: 3px; }
  .vasos i { flex: 1; height: 8px; border-radius: 3px; background: var(--track); }
  .vasos i.lleno { background: var(--agua); }
  .hab .botones { display: flex; gap: 6px; }
  .hab .botones button { flex: 1; height: 36px; border-radius: 11px; border: 0; background: var(--track); color: var(--agua); font-weight: 700; font-size: 13px; white-space: nowrap; padding: 0 4px; }
  .hab .botones button.menos { flex: 0 0 36px; color: var(--muted); }
  .crea { align-items: flex-start; }
  .crea button.marca { width: 100%; height: 44px; border-radius: 13px; border: 1px dashed var(--track); background: none; color: var(--muted); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .crea button.marca[aria-pressed="true"] { background: var(--fat); border: 1px solid var(--fat); color: var(--ink); }
  .crea small { font-size: 12px; color: var(--muted); }

  /* Menús */
  .receta-nota { margin: -6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .etiq { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fat); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Cargando">
  <div class="logo" aria-hidden="true"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#0d0b0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3c-1 4-3 7-5.5 9.5M13 3c1.5 3.5 3.5 6 5.5 8"/><path d="M13 3c2-1 4-.8 5.5.5"/><circle cx="7.5" cy="16.5" r="4" fill="#0d0b0c"/><circle cx="18.5" cy="15.5" r="4" fill="#0d0b0c"/></svg></div>
  <div class="nombre">Cherry</div>
  <div class="puntos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="frase" id="frase">Abriendo tu despensa…</div>
</div>
<div class="app">
  <div class="carga" id="carga"></div>
  <header class="cab"><h1 id="titulo">Cherry</h1><div class="sub" id="sub"></div>
    <button class="mas" id="mas" aria-label="Añadir" hidden></button></header>
  <main id="vista"><p class="nota">Cargando…</p></main>
  <nav id="nav" hidden></nav>
  <div class="velo" id="velo" hidden></div>
  <div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="deshacer" hidden>Deshacer</button></div>
</div>


<!-- Widget de Scriptable: la app lo copia con tu servidor y tu clave ya puestos. -->
<script type="text/plain" id="widgetCodigo">
// Widget de Cherry para Scriptable. Tamaño pequeño o mediano. Al tocarlo se abre Cherry.
const URL = '__URL__';
const APP = '__APP__';
const C = { fondo: '#0d0b0c', cereza: '#ff5c7a', texto: '#f6f2f2', gris: '#a1979a', pista: '#2e272a', pro: '#6fb7ff', car: '#ffcf5a', gra: '#5ee0b0', agua: '#5fd4f4' };
const col = c => new Color(c);
const num = x => Math.round(x).toLocaleString('es-ES');
let d;
try { d = await new Request(URL).loadJSON(); } catch (e) { d = null; }
const w = new ListWidget();
w.backgroundColor = col(C.fondo);
w.setPadding(14, 16, 14, 16);
w.url = APP;
w.refreshAfterDate = new Date(Date.now() + 15 * 60000);
function texto(pila, t, color, fuente) { const x = pila.addText(String(t)); x.textColor = col(color); x.font = fuente; x.lineLimit = 1; return x; }
function barra(pila, valor, max, color, ancho) {
  const p = pila.addStack();
  p.size = new Size(ancho, 6);
  p.cornerRadius = 3;
  p.backgroundColor = col(C.pista);
  const f = Math.max(0, Math.min(1, max ? valor / max : 0));
  if (f > 0.03) {
    const r = p.addStack();
    r.size = new Size(Math.round(ancho * f), 6);
    r.cornerRadius = 3;

<script>
// <calculos>
// Metas y ajustes. Funciones puras: las prueba pruebas/test.js.
const ACTIVIDAD = { poco: 1.375, medio: 1.55, mucho: 1.725 };
// kcal sobre el mantenimiento, proteína en g por kg y ritmo de peso buscado en kg por semana.
const OBJETIVO = {
  ganar: { nombre: 'Ganar músculo', kcal: 250, prot: 1.8, ritmo: [0.1, 0.3] },
  mantener: { nombre: 'Mantener', kcal: 0, prot: 1.6, ritmo: [-0.15, 0.15] },
  perder: { nombre: 'Perder grasa', kcal: -400, prot: 2.0, ritmo: [-0.7, -0.25] },
};
const PASO_AJUSTE = 150;
const DIAS_ENTRE_AJUSTES = 14;

// Mifflin-St Jeor × actividad; grasa al 25 % de las kcal y el resto en carbohidratos.
function calcularMeta(p) {
  const peso = +p.peso, altura = +p.altura, edad = +p.edad;
  const bmr = 10 * peso + 6.25 * altura - 5 * edad + (p.sexo === 'm' ? -161 : 5);
  const mant = bmr * (ACTIVIDAD[p.actividad] || ACTIVIDAD.medio);
  const o = OBJETIVO[p.objetivo] || OBJETIVO.ganar;
  const kcal = Math.round((mant + o.kcal) / 50) * 50;
  const prot = Math.round(peso * o.prot / 5) * 5;
  const grasa = Math.round(kcal * 0.25 / 9 / 5) * 5;
  const carb = Math.max(0, Math.round((kcal - prot * 4 - grasa * 9) / 4 / 5) * 5);
  return { kcal, prot, carb, grasa, mant: Math.round(mant / 10) * 10 };
}

function diasEntre(a, b) {
  const t = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  return Math.round((t(b) - t(a)) / 86400000);
}
function diaMas(dia, n) {
  const [y, m, d] = dia.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
const promedio = a => a.reduce((s, x) => s + x, 0) / a.length;

// Cada pesada con la media de las pesadas de sus últimos 7 días.
function mediaMovil(pesos) {
  return pesos.map(p => ({ ...p, media: promedio(pesos.filter(q => q.dia <= p.dia && diasEntre(q.dia, p.dia) < 7).map(q => q.kg)) }));
}

// kg por semana: media de los últimos 7 días contra la de hace 2 semanas (la misma cuenta que el ajuste);
// si aún no hay pesadas de hace 2 semanas, contra la semana anterior. Hacen falta 2 pesadas en cada tramo.
function ritmoSemanal(pesos, hoy) {
  const tramo = (a, b) => pesos.filter(p => { const d = diasEntre(p.dia, hoy); return d >= a && d < b; }).map(p => p.kg);
  const ahora = tramo(0, 7), hace2 = tramo(14, 21), hace1 = tramo(7, 14);
  if (ahora.length < 2) return null;
  if (hace2.length >= 2) return (promedio(ahora) - promedio(hace2)) / 2;
  if (hace1.length >= 2) return promedio(ahora) - promedio(hace1);
  return null;
}

// Cada 2 semanas desde el último cambio de meta: compara la media de esta semana con la de hace 2 semanas.
function revisarAjuste(pesos, meta, objetivo, hoy) {
  if (!meta) return { estado: 'sin-meta' };
  const desde = diasEntre(meta.dia, hoy);
  if (desde < DIAS_ENTRE_AJUSTES) return { estado: 'pronto', proxima: diaMas(meta.dia, DIAS_ENTRE_AJUSTES) };
  const tramo = (a, b) => pesos.filter(p => { const d = diasEntre(p.dia, hoy); return d >= a && d < b; }).map(p => p.kg);
  const ahora = tramo(0, 7), antes = tramo(14, 21);
  if (ahora.length < 3 || antes.length < 3) return { estado: 'faltan', ahora: ahora.length, antes: antes.length };
  const ritmo = (promedio(ahora) - promedio(antes)) / 2;
  const [min, max] = (OBJETIVO[objetivo] || OBJETIVO.ganar).ritmo;
  const cambio = ritmo < min ? PASO_AJUSTE : ritmo > max ? -PASO_AJUSTE : 0;
  if (!cambio) return { estado: 'ok', ritmo, min, max };
  return {
    estado: cambio > 0 ? 'subir' : 'bajar', ritmo, min, max, cambio,
    nueva: { kcal: meta.kcal + cambio, prot: meta.prot, carb: Math.max(0, meta.carb + Math.round(cambio / 4)), grasa: meta.grasa },
  };
}
// Agua: 35 ml por kg, de 250 en 250 (el servidor hace la misma cuenta para el widget).
function metaAgua(kg) {
  return Math.round((+kg || 70) * 35 / 250) * 250;
}
// Días seguidos con creatina hasta hoy; si hoy aún no la has tomado, cuenta hasta ayer.
function racha(diarios, hoy) {
  const si = new Set(diarios.filter(x => x.creatina).map(x => x.dia));
  let d = si.has(hoy) ? hoy : diaMas(hoy, -1);
  let n = 0;
  while (si.has(d)) { n++; d = diaMas(d, -1); }
  return n;
}
